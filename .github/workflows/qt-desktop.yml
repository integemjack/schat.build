name: Qt Desktop

# Packages the desktop clients for all 3 OSes.
#
#   macOS   : **两条并存的 mac 腿,用户在 release 里二选一**。
#     · macos    = 原生 SwiftUI 客户端 (desktop/macos, arm64) — 苹果特效版(液态玻璃),macOS 14+。
#                  通话核心 schat_core+libdatachannel 静态链 + brew dylib 内嵌;签名+公证
#                  .dmg + 一键更新 .zip。arch-native brew dylib → arm64-only。
#     · macos-qt = Qt/QML 通用兼容版 (desktop/desktop-qt, arm64 + x86_64) — minos 12.0,跑
#                  macOS 12/13+ 与 Intel(Qt 不碰系统新 API,解决「macOS 13 装不上」)。资产名带
#                  `qt` 标记,Swift 更新器 pickAsset 按 -qt/qt- 排除它 → 两条线自动更新永不串包。
#   Windows : x64 (MSYS2/MINGW64) Qt6/QML          — 自制安装器 (installer/mkpkg)
#             (arm64 needs an MSVC port of the vendored MinGW deps — not covered yet)
#   Linux   : x86_64 + aarch64 (Debian trixie containers) Qt6/QML — .deb (both arches)
#             + a self-contained AppImage on x86_64 (linuxdeploy)
#
# ⚠️ **Qt 三条腿全部静态链接**(源仓 qt 9.14.344)。来源不同,判据相同 —— 每条腿都有一条
# 「产物里不许出现 Qt 动态库」的断言,别为了让某条腿变绿把断言放松:
#   · Windows = MSYS2 `mingw-w64-x86_64-qt6-static`(现成的整包静态 Qt)
#   · mac / Linux = qt-static.yml 预编译的 tarball(官方不提供静态二进制,只能自编)
# 随之整段消失的:windeployqt / macdeployqt / linuxdeploy-plugin-qt / ~90 个 DLL 的递归闭包 /
# deb 的 qml6-module-* 依赖串。**这些都不是「顺手删的」,而是静态之后它们的工作对象不存在了。**
#
# The macOS SwiftUI leg mirrors desktop/macos/scripts/{build-core,package-app}.sh (本地实测
# 流程) + qt 线沉淀的 inside-out 签名/公证;Windows/Linux legs are proven by this workflow.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ireoo/Secret-Chat 的分支或标签"
        required: false
        # 打包只用 `main`(版本分支开发完成后合并进 main);要临时打某版本分支就显式传 ref 覆盖。
        default: "main"
  # Reusable: build.yml's "Build All" calls this (uses:) so the MAIN release bundles the Qt
  # desktop packages — one combined release, single source of truth. This workflow has NO
  # release job of its own; the caller publishes. Standalone workflow_dispatch above still runs
  # the full multi-arch build for desktop-only test builds (uploads artifacts, no release).
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: "main"

permissions:
  contents: write

# Supersede an in-flight run on a new push (iteration-friendly; these are heavy multi-arch builds).
concurrency:
  group: qt-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_REPO: Ireoo/Secret-Chat
  # `inputs` context is populated for BOTH workflow_dispatch and workflow_call.
  SRC_REF: ${{ inputs.ref || 'main' }}
  # GitHub-hosted runners reach github.com directly — skip the gh-proxy.com mirror (China-only)
  # that third_party/fetch_deps.sh defaults to.
  SCHAT_GH_MIRROR: https://github.com
  SCHAT_RAW_MIRROR: https://raw.githubusercontent.com
  # 预编译静态 Qt 的版本(mac / Linux 两条腿)。改这里 = 换 kit,必须先用 qt-static.yml
  # 把对应版本编出来并发成 release `qt-static-<ver>`,否则 fetch-static-qt.sh 404 直接失败。
  # 与源仓 desktop/desktop-qt/scripts/fetch-static-qt.sh 的默认值保持一致。
  # ⚠️ 6.8 LTS 不是随手挑的 —— 见 macos-qt 那条腿里「版本回到 6.8 LTS 是有意的」那段。
  SCHAT_QT_STATIC_VER: "6.8.4"

jobs:
  # ── macOS: 原生 SwiftUI 客户端(desktop/macos)。流程 = 本地脚本原样上 CI:
  # fetch_deps → build-core.sh(schat_core+libdatachannel,无 Qt)→ package-app.sh
  # (swift build -c release + 组装 SChat.app + 内嵌 brew dylib + ad-hoc 签)→ 真签覆盖
  # (inside-out,hardened runtime + mic/camera entitlements —— 没有它们公证包在
  # 通话/扫一扫/语音开摄像头麦克风瞬间被杀,与 qt 线 schat.entitlements 同因)→
  # zip(一键更新资产)+ 自定义「双击运行」dmg → notarize+staple。arm64-only。──────────
  macos:
    name: macOS SwiftUI (arm64)
    # macos-26(Xcode 26)—— 本地开发/实测同代工具链(Swift 6.3);macos-15 的 Xcode 16/
    # Swift 6.0 strict concurrency 更严(non-Sendable [String:Any] 跨隔离返回直接报错),
    # 实测编不过本地绿的代码。iOS 腿同样钉 macos-26。
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}

      - name: Install build deps (Homebrew)
        run: brew install cmake ninja pkg-config opus openh264 libsodium openssl@3

      - name: Select Xcode 26 (match local toolchain)
        shell: bash
        run: |
          set -euo pipefail
          # 显式选最新 Xcode 26(runner 镜像默认值会漂移;Swift 需与本地开发工具链同代)。
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          swift --version

      - name: Fetch third-party deps (libdatachannel source + single headers)
        working-directory: desktop/desktop-qt
        run: bash third_party/fetch_deps.sh

      - name: Build call core (schat_core + libdatachannel, no Qt)
        shell: bash
        run: bash desktop/macos/scripts/build-core.sh

      - name: Build + assemble SChat.app (package-app.sh)
        shell: bash
        run: bash desktop/macos/scripts/package-app.sh

      # Import the Developer ID cert into a throwaway keychain (only if the secret is set —
      # otherwise the bundle keeps package-app.sh's ad-hoc signature so forks still build).
      - name: Import Developer ID signing cert
        id: signcert
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PW }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "MACOS_CERT_P12 not set — ad-hoc signing"; echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KPW="$(openssl rand -base64 18)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${CERT_PW:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          # Make the temp keychain searchable alongside the defaults so codesign finds the identity.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')
          rm -f "$RUNNER_TEMP/cert.p12"
          [ -n "$IDENTITY" ] || { echo "no Developer ID identity in the imported cert"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "imported identity: $IDENTITY"

      - name: Sign + package (.zip / .dmg) + notarize
        shell: bash
        working-directory: desktop/macos
        env:
          SIGN_IDENTITY: ${{ steps.signcert.outputs.identity }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          VER=$(grep -m1 'marketingVersion = ' Sources/SecretChatMac/Models/ChatModels.swift | sed -E 's/.*"([^"]+)".*/\1/')
          APP="dist/SChat.app"
          [ -d "$APP" ] || { echo "ERROR: package-app.sh did not produce $APP"; exit 1; }
          echo "=== app binary arch (arm64 expected) ==="
          lipo -info "$APP/Contents/MacOS/SecretChatMac" || true
          # hardened-runtime entitlements(真签才需要;qt 线 schat.entitlements 同因,
          # SwiftUI 线无 QML JIT,只留 mic/camera 设备权限)。
          cat > "$RUNNER_TEMP/mac.entitlements" <<'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.device.audio-input</key><true/>
            <key>com.apple.security.device.camera</key><true/>
          </dict>
          </plist>
          ENT
          if [ -n "${SIGN_IDENTITY:-}" ] && [ "$SIGN_IDENTITY" != "-" ]; then
            # Inside-out:先重签 Frameworks 下每个 dylib(package-app.sh 改过 install name,
            # 其 ad-hoc 签名也要被真签覆盖),再签外壳。
            find "$APP/Contents/Frameworks" -name '*.dylib' -type f 2>/dev/null | while read -r f; do
              codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$f"
            done
            codesign --force --options runtime --timestamp \
              --entitlements "$RUNNER_TEMP/mac.entitlements" --sign "$SIGN_IDENTITY" "$APP"
            echo "signed with: $SIGN_IDENTITY"
          else
            echo "ad-hoc signature kept (no cert secret)"
          fi
          # Strict deep verify — shallow `codesign -v` reports OK even when a nested dylib is
          # broken (the exact failure users see as a launch crash).
          codesign --verify --deep --strict --verbose=2 "$APP" && echo "codesign verify OK"
          mkdir -p out
          # In-app one-click update asset: plain zip of the SIGNED bundle(客户端更新器优先
          # .zip:解包原位替换重启;公证票据按签名在线解析,zip 无需单独 staple)。
          ditto -c -k --keepParent "$APP" "out/SChat-macos-${VER}-arm64.zip"
          # Custom Finder layout dmg(「双击运行」背景,best-effort,失败回退朴素 dmg)。
          DMG="out/SChat-macos-${VER}-arm64.dmg"
          DMGSTAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMGSTAGE"; mkdir -p "$DMGSTAGE/.background"
          ditto "$APP" "$DMGSTAGE/SChat.app"
          if [ -f ../desktop-qt/scripts/dmg-background.png ]; then
            cp ../desktop-qt/scripts/dmg-background.png "$DMGSTAGE/.background/bg.png"
          else
            echo "no dmg background asset — plain window"
          fi
          layout_dmg() {
            set -e
            RW="$RUNNER_TEMP/schat-rw.dmg"
            rm -f "$RW"
            hdiutil detach "/Volumes/SChat" -force >/dev/null 2>&1 || true
            hdiutil create -volname "SChat" -srcfolder "$DMGSTAGE" -ov -format UDRW "$RW"
            hdiutil attach "$RW" -noautoopen
            sleep 2
            osascript <<'OSA'
          tell application "Finder"
            tell disk "SChat"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {200, 120, 740, 500}
              set vo to the icon view options of container window
              set arrangement of vo to not arranged
              set icon size of vo to 128
              set text size of vo to 13
              try
                set background picture of vo to file ".background:bg.png"
              end try
              set position of item "SChat.app" of container window to {270, 150}
              update without registering applications
              delay 1
              close
            end tell
          end tell
          OSA
            sync
            hdiutil detach "/Volumes/SChat" -force
            hdiutil convert "$RW" -format UDZO -o "$DMG" -ov
            rm -f "$RW"
          }
          if ! ( layout_dmg ); then
            echo "custom dmg layout failed — falling back to plain dmg"
            rm -f "$DMG"
            for attempt in 1 2 3 4; do
              hdiutil detach "/Volumes/SChat" -force >/dev/null 2>&1 || true
              if hdiutil create -volname "SChat" -srcfolder "$APP" -ov -format UDZO "$DMG"; then
                break
              fi
              echo "hdiutil create failed (attempt $attempt/4) — retrying in 8s"; sleep 8
            done
          fi
          [ -f "$DMG" ] || { echo "ERROR: dmg was not created"; exit 1; }
          # Notarize + staple(仅真签 + 有公证凭据;政策:release 里绝不放未公证 dmg —— 公证
          # 失败则本步失败、artifact 不上传,而不是发一个未公证包)。
          if [ -n "${SIGN_IDENTITY:-}" ] && [ "$SIGN_IDENTITY" != "-" ] && [ -n "${NOTARY_KEY:-}" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/nkey.p8"
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/nkey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
              --wait --timeout 45m
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG" && echo "notarized + stapled OK"
            rm -f "$RUNNER_TEMP/nkey.p8"
          else
            echo "notary creds not set (or ad-hoc signature) — skipping notarization (fork build)"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: macos-swiftui
          path: desktop/macos/out/*

  # ── macOS(第二条 mac 腿):Qt/QML 通用兼容版(arm64 + x86_64)。与上面的 SwiftUI 腿并存,
  # 用户在 release 里二选一 —— Swift = 苹果特效版(液态玻璃,macOS 14+);Qt = 兼容版,
  # minos 12.0 跑 macOS 12/13+ 与 Intel(Qt 不碰系统新 API)。这条解决「macOS 13 装不上」。
  # 依赖(opus/openh264/libsodium/openssl)在 arm64 runner 上从源码编 universal;四个
  # 「CI 全绿装了跑不起来」的坑(签名顺序、qt5compat/qtshadertools 运行时 QML 模块、
  # OpenSSL dylib 运行时 dlopen 需内嵌、GUI 启动)已治好。⚠️ 资产名带 `qt` 标记
  # (SChat-macos-qt-<ver>-universal.{zip,dmg}):Swift 更新器 pickAsset 按 -qt/qt- 排除它,
  # 两条线的自动更新永不互相串包 —— **改名必须保留该标记**。版本走 Version.h kVersion。
  macos-qt:
    name: macOS Qt (Universal2)
    runs-on: macos-14
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"   # Qt 6.8 requires macOS 12+; deps built to match.
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}

      - name: Install build tools (Homebrew)
        run: brew install cmake ninja pkg-config nasm autoconf automake libtool

      - name: Build universal (arm64+x86_64) static deps → /tmp/uni
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=12.0
          UNI=/tmp/uni; SRC=/tmp/src; J=$(sysctl -n hw.ncpu)
          mkdir -p "$UNI/lib" "$UNI/include" "$SRC"
          DL="${SCHAT_GH_MIRROR:-https://github.com}"

          echo "::group::opus 1.5.2 (CMake, native universal)"
          cd "$SRC"; curl -fsSL https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz -o opus.tgz
          tar xf opus.tgz && cd opus-1.5.2
          cmake -S . -B b -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_INSTALL_PREFIX="$UNI" \
            -DOPUS_BUILD_SHARED_LIBRARY=OFF -DOPUS_BUILD_PROGRAMS=OFF
          cmake --build b -j"$J"; cmake --install b
          echo "::endgroup::"

          echo "::group::openh264 2.4.1 (Makefile per-arch, arch-pinned compiler + lipo)"
          # openh264's darwin Makefile compiles the C/C++ with `-m64` (NOT `-arch x86_64`) for its
          # x86_64 target. On an Intel host `-m64` == x86_64, but on THIS Apple-Silicon runner
          # `-m64` just means "64-bit" → arm64 objects, while the x86 .asm files nasm-assemble as
          # real x86_64 → a mixed archive lipo rejects. Pin CC/CXX to `clang -arch <A>` so an
          # explicit -arch overrides the Makefile's trailing -m64 and every object is one arch.
          cd "$SRC"; curl -fsSL "$DL/cisco/openh264/archive/refs/tags/v2.4.1.tar.gz" -o oh.tgz
          tar xf oh.tgz
          for A in arm64 x86_64; do
            rm -rf "oh-$A"; cp -R openh264-2.4.1 "oh-$A"
            make -C "oh-$A" -j"$J" OS=darwin ARCH="$A" \
              CC="clang -arch $A" CXX="clang++ -arch $A" libraries
            cp "oh-$A/libopenh264.a" "/tmp/oh-$A.a"
            lipo -info "/tmp/oh-$A.a"   # must report a single arch, else the mix is back
          done
          lipo -create /tmp/oh-arm64.a /tmp/oh-x86_64.a -output "$UNI/lib/libopenh264.a"
          mkdir -p "$UNI/include/wels"; cp -f openh264-2.4.1/codec/api/wels/*.h "$UNI/include/wels/"
          echo "::endgroup::"

          echo "::group::libsodium 1.0.20 (configure per-arch in SEPARATE trees + lipo)"
          cd "$SRC"; curl -fsSL https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable.tar.gz -o sodium.tgz
          mkdir -p sodium-src && tar -C sodium-src --strip-components=1 -xf sodium.tgz
          for A in arm64 x86_64; do
            H=$([ "$A" = arm64 ] && echo aarch64-apple-darwin || echo x86_64-apple-darwin)
            rm -rf "sodium-$A"; cp -R sodium-src "sodium-$A"
            ( cd "sodium-$A" && ./configure --enable-static --disable-shared --prefix="/tmp/sodium-$A" --host="$H" \
                CC="clang -arch $A" CFLAGS="-arch $A -mmacosx-version-min=12.0 -O2" \
              && make -j"$J" && make install )
          done
          lipo -create /tmp/sodium-arm64/lib/libsodium.a /tmp/sodium-x86_64/lib/libsodium.a -output "$UNI/lib/libsodium.a"
          cp -Rf /tmp/sodium-arm64/include/* "$UNI/include/"
          echo "::endgroup::"

          echo "::group::openssl 3.3.2 (Configure per-arch + lipo — STATIC for libdatachannel DTLS, SHARED for Qt TLS)"
          # Build BOTH static (.a, linked into libdatachannel for DTLS) and shared (.dylib). Qt's
          # openssl TLS backend dlopens libssl/libcrypto at RUNTIME — macdeployqt does NOT bundle
          # OpenSSL, so without the dylibs the backend fails ("Failed to load libssl/libcrypto")
          # and EVERY https/wss call dies at http=0 before login. We bundle the universal dylibs.
          cd "$SRC"; curl -fsSL "$DL/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz" -o ssl.tgz
          tar xf ssl.tgz
          for A in arm64 x86_64; do
            T=$([ "$A" = arm64 ] && echo darwin64-arm64-cc || echo darwin64-x86_64-cc)
            rm -rf "ssl-$A"; cp -R openssl-3.3.2 "ssl-$A"; cd "ssl-$A"
            ./Configure "$T" no-tests no-apps --prefix="/tmp/ssl-$A" -mmacosx-version-min=12.0
            make -j"$J"; make install_sw
            cd "$SRC"
          done
          lipo -create /tmp/ssl-arm64/lib/libssl.a    /tmp/ssl-x86_64/lib/libssl.a    -output "$UNI/lib/libssl.a"
          lipo -create /tmp/ssl-arm64/lib/libcrypto.a /tmp/ssl-x86_64/lib/libcrypto.a -output "$UNI/lib/libcrypto.a"
          # Shared dylibs for Qt: fix each thin dylib's install names FIRST (their build-tree
          # /tmp paths won't exist on a user's Mac), then lipo the fixed thin libs universal.
          # @loader_path for the inter-dylib ref → resolves next to itself (Frameworks/) always.
          for A in arm64 x86_64; do
            install_name_tool -id @rpath/libcrypto.3.dylib /tmp/ssl-$A/lib/libcrypto.3.dylib
            install_name_tool -id @rpath/libssl.3.dylib    /tmp/ssl-$A/lib/libssl.3.dylib
            install_name_tool -change /tmp/ssl-$A/lib/libcrypto.3.dylib @loader_path/libcrypto.3.dylib /tmp/ssl-$A/lib/libssl.3.dylib
          done
          lipo -create /tmp/ssl-arm64/lib/libcrypto.3.dylib /tmp/ssl-x86_64/lib/libcrypto.3.dylib -output "$UNI/lib/libcrypto.3.dylib"
          lipo -create /tmp/ssl-arm64/lib/libssl.3.dylib    /tmp/ssl-x86_64/lib/libssl.3.dylib    -output "$UNI/lib/libssl.3.dylib"
          cp -Rf /tmp/ssl-arm64/include/* "$UNI/include/"
          mkdir -p "$UNI/lib/pkgconfig"; cp -f /tmp/ssl-arm64/lib/pkgconfig/*.pc "$UNI/lib/pkgconfig/" 2>/dev/null || true
          echo "::endgroup::"

          echo "=== universal dep archives (must all list arm64 + x86_64) ==="
          for f in libopus libopenh264 libsodium libssl libcrypto; do lipo -info "$UNI/lib/$f.a"; done

      # ── 静态 Qt(源仓 qt 9.14.344;aqt / install-qt-action 已移除)────────────────────
      # 官方**不提供**静态 Qt 二进制,aqt 装的一律是动态 kit —— 所以这条腿改成下载
      # schat.build 自己预编译的静态 Qt(qt-static.yml 手动触发产出,tarball 挂在
      # release `qt-static-<ver>` 上)。下载 + 校验 + 解压由源仓的
      # desktop/desktop-qt/scripts/fetch-static-qt.sh 负责(sha256 不符即失败)。
      #
      # ⚠️ **版本回到 6.8 LTS 是有意的,别顺手升回 6.12。** 两条硬约束:
      #   ① 这条腿的存在理由是「minos 12.0,跑 macOS 12/13+ 与 Intel」,而 Qt 6.9+ 官方最低
      #      支持已抬到 macOS 13 —— 用 6.11/6.12 编,CMAKE_OSX_DEPLOYMENT_TARGET=12.0 就只是
      #      嘴上说支持。6.8 LTS 官方支持 macOS 12。
      #   ② **QML 兼容下限 6.8** 这条铁律要继续成立:绝不准声明式使用 6.9+ 属性,要用就
      #      `if ("x" in win)` 运行时探测。9.12.159 的 `topPadding: 0` 就是这么把 mac dmg 与
      #      trixie deb 一起干成「秒退且无崩溃报告」的。
      # (Windows 那条腿仍是 MSYS2 滚动的 qt6-static 6.11.x —— 版本不统一是既有状态,不是这次
      #  引入的;下限由最低的那条腿决定,也就是 6.8。)
      - name: Fetch prebuilt static Qt (universal)
        working-directory: desktop/desktop-qt
        run: |
          set -euo pipefail
          QT_PREFIX="$(bash scripts/fetch-static-qt.sh | tail -1)"
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "QT_PREFIX=$QT_PREFIX"

      - name: Fetch third-party deps (libdatachannel source + single headers)
        working-directory: desktop/desktop-qt
        run: bash third_party/fetch_deps.sh

      - name: Configure + build (Universal2 Release, static Qt)
        working-directory: desktop/desktop-qt
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DSCHAT_MAC_DEP_PREFIX=/tmp/uni \
            -DOPENSSL_ROOT_DIR=/tmp/uni -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      # 「编出来了」不等于「静态成了」——CMake 找错 kit(机器上还有 brew 的动态 Qt)照样编得过,
      # 产物却在用户机上找不到 Qt。直接查 Mach-O 的加载命令。
      - name: Assert 二进制不依赖任何 Qt 框架/动态库
        working-directory: desktop/desktop-qt
        run: |
          set -euo pipefail
          otool -L build/app-qt/SChat.app/Contents/MacOS/SChat > /tmp/otool.txt
          cat /tmp/otool.txt
          if grep -E 'QtCore|QtQuick|QtGui|libQt' /tmp/otool.txt; then
            echo "FATAL: 仍链接着动态 Qt(CMAKE_PREFIX_PATH 没指到静态 kit?)"; exit 1
          fi
          echo "OK: 无动态 Qt 依赖"

      # Import the Developer ID cert into a throwaway keychain (only if the secret is set —
      # otherwise the package step falls back to ad-hoc signing so forks still build).
      - name: Import Developer ID signing cert
        id: signcert
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PW }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "MACOS_CERT_P12 not set — ad-hoc signing"; echo "identity=-" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KPW="$(openssl rand -base64 18)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${CERT_PW:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" >/dev/null
          # Make the temp keychain searchable alongside the defaults so codesign finds the identity.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')
          rm -f "$RUNNER_TEMP/cert.p12"
          [ -n "$IDENTITY" ] || { echo "no Developer ID identity in the imported cert"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "imported identity: $IDENTITY"

      - name: Package .dmg (静态 Qt,无 macdeployqt)
        shell: bash
        working-directory: desktop/desktop-qt
        env:
          SIGN_IDENTITY: ${{ steps.signcert.outputs.identity }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          VER=$(grep -E 'kVersion = "[^"]+"' core/include/schat/Version.h | sed -E 's/.*"([^"]+)".*/\1/')
          APP="build/app-qt/SChat.app"
          echo "=== app binary archs (must be arm64 + x86_64) ==="
          lipo -info "$APP/Contents/MacOS/SChat" || true
          # ── macdeployqt 已移除(源仓 qt 9.14.344)────────────────────────────────────
          # Qt 静态之后它无事可做:bundle 里没有 Qt framework 要拷、没有 PlugIns 要挑、没有
          # Resources/qml 要部署,也就没有 install_name_tool 的重写 —— 「签名必须在 macdeployqt
          # 之后」那条顺序约束的成因随之消失(不过下面仍然保持「先签嵌套、后签外壳」的
          # inside-out 顺序:OpenSSL 那两个 dylib 还在,--deep 依旧会漏签它们)。
          # **别因为「历史上一直跑」把它加回来**:对静态 kit 跑 macdeployqt 只会报错或空跑。
          mkdir -p "$APP/Contents/Frameworks"
          # Bundle the universal OpenSSL dylibs so Qt's openssl TLS backend can dlopen them at
          # runtime — 这一条**不因为 Qt 静态而改变**:TLS 后端是运行期 dlopen libssl/libcrypto 的,
          # 缺了就是每一次 https/wss 在登录前静默失败。Frameworks/ 在后端的 dlopen 搜索路径上;
          # install name 已在 deps 步骤里修成 @rpath / @loader_path。
          cp /tmp/uni/lib/libssl.3.dylib /tmp/uni/lib/libcrypto.3.dylib "$APP/Contents/Frameworks/"
          lipo -info "$APP/Contents/Frameworks/libssl.3.dylib" "$APP/Contents/Frameworks/libcrypto.3.dylib"
          # Product name = SChat everywhere: CMake OUTPUT_NAME=SChat now builds SChat.app with inner
          # binary SChat (CFBundleExecutable=SChat) directly — no post-build rename needed anymore.
          # INSIDE-OUT signing (not `--deep`),先签嵌套再签外壳。历史成因是 macdeployqt 会往
          # Contents/Resources/qml 放一堆 QML 插件 dylib 而 --deep 恰好跳过它们(hardened
          # runtime 的 library validation 在插件加载那一刻杀掉进程 = 「打开就闪退」,外层签名
          # 却看着完好)。Qt 静态之后那些 dylib 不存在了,**但这个顺序仍然必须保持**:
          # Frameworks/ 下还有 libssl/libcrypto 两个 dylib,--deep 对它们是同一种漏法。
          # (「签名必须在 macdeployqt 之后」那条约束已随 macdeployqt 一起作废 —— 现在没有任何
          #  install_name_tool 重写会破坏签名。)
          sign_nested() {   # "$@" = codesign flags (identity etc.) — signs all nested Mach-Os
            find "$APP/Contents/Frameworks" "$APP/Contents/PlugIns" "$APP/Contents/Resources" \
                 \( -name '*.dylib' -o -name '*.so' \) -type f 2>/dev/null | while read -r f; do
              codesign --force "$@" "$f"
            done
            find "$APP/Contents/Frameworks" -maxdepth 1 -name '*.framework' -type d 2>/dev/null | while read -r f; do
              codesign --force "$@" "$f"
            done
          }
          if [ -n "${SIGN_IDENTITY:-}" ] && [ "$SIGN_IDENTITY" != "-" ]; then
            # Real Developer ID + hardened runtime + secure timestamp (required for notarization).
            # Entitlements (source repo desktop/desktop-qt/app-qt/schat.entitlements): QML JIT +
            # camera/mic device access — WITHOUT the device entitlements the hardened-runtime app
            # is killed when 扫一扫/通话/语音 opens the camera or microphone.
            [ -f app-qt/schat.entitlements ] || { echo "ERROR: app-qt/schat.entitlements missing (source checkout too old?) — a hardened-runtime build without the device entitlements crashes on camera/mic use"; exit 1; }
            sign_nested --options runtime --timestamp --sign "$SIGN_IDENTITY"
            codesign --force --options runtime --timestamp \
              --entitlements app-qt/schat.entitlements --sign "$SIGN_IDENTITY" "$APP"
            echo "signed with: $SIGN_IDENTITY"
          else
            sign_nested --sign -       # ad-hoc fallback (no cert secret)
            codesign --force --sign - "$APP"
          fi
          # Strict deep verify — the old shallow `codesign -v` reported OK even when a nested
          # dylib was left unsigned/broken (the exact failure users see as a launch crash).
          codesign --verify --deep --strict --verbose=2 "$APP" && echo "codesign verify OK"
          mkdir -p out
          # In-app one-click update asset: a plain zip of the SIGNED bundle. UpdateChecker prefers
          # .zip (unpack → replace the running bundle in place → relaunch, no dmg drag). The
          # binaries inside are the same ones notarized via the dmg submission below (notary
          # tickets are per code-signature, Gatekeeper resolves online), and the in-app download
          # never carries quarantine anyway.
          ditto -c -k --keepParent "$APP" "out/SChat-macos-qt-${VER}-universal.zip"
          # Build the .dmg from the SIGNED bundle. Do NOT use `macdeployqt -dmg` here — it would
          # re-deploy (install_name_tool again) and re-break the signature. hdiutil just packs it.
          # Custom Finder layout (cosmetics, best-effort — must NEVER block a release): 540x380
          # window, 128pt icon centered on a 「双击运行」 hint background (source repo
          # desktop/desktop-qt/scripts/dmg-background.png, DPI-144-tagged @2x). Flow: staging dir
          # → UDRW dmg → Finder AppleScript writes the .DS_Store layout → convert to UDZO. Any
          # failure falls back to the old plain UDZO pack.
          DMG="out/SChat-macos-qt-${VER}-universal.dmg"
          DMGSTAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMGSTAGE"; mkdir -p "$DMGSTAGE/.background"
          ditto "$APP" "$DMGSTAGE/SChat.app"
          if [ -f scripts/dmg-background.png ]; then
            cp scripts/dmg-background.png "$DMGSTAGE/.background/bg.png"
          else
            echo "no dmg background asset (old source checkout) — plain window"
          fi
          layout_dmg() {
            set -e
            RW="$RUNNER_TEMP/schat-rw.dmg"
            rm -f "$RW"
            hdiutil detach "/Volumes/SChat" -force >/dev/null 2>&1 || true
            hdiutil create -volname "SChat" -srcfolder "$DMGSTAGE" -ov -format UDRW "$RW"
            hdiutil attach "$RW" -noautoopen
            sleep 2
            osascript <<'OSA'
          tell application "Finder"
            tell disk "SChat"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {200, 120, 740, 500}
              set vo to the icon view options of container window
              set arrangement of vo to not arranged
              set icon size of vo to 128
              set text size of vo to 13
              try
                set background picture of vo to file ".background:bg.png"
              end try
              set position of item "SChat.app" of container window to {270, 150}
              update without registering applications
              delay 1
              close
            end tell
          end tell
          OSA
            sync
            hdiutil detach "/Volumes/SChat" -force
            hdiutil convert "$RW" -format UDZO -o "$DMG" -ov
            rm -f "$RW"
          }
          if ! ( layout_dmg ); then
            echo "custom dmg layout failed — falling back to plain dmg"
            rm -f "$DMG"
            # hdiutil create can transiently fail with "Resource busy" on CI (Spotlight indexing
            # the srcfolder / a lingering mount). Detach any stale volume and retry a few times.
            for attempt in 1 2 3 4; do
              hdiutil detach "/Volumes/SChat" -force >/dev/null 2>&1 || true
              if hdiutil create -volname "SChat" -srcfolder "$APP" -ov -format UDZO "$DMG"; then
                break
              fi
              echo "hdiutil create failed (attempt $attempt/4) — retrying in 8s"; sleep 8
            done
          fi
          [ -f "$DMG" ] || { echo "ERROR: dmg was not created"; exit 1; }
          # Notarize + staple the signed dmg (only with a real signature + notary creds; Apple
          # rejects ad-hoc submissions). Uses an App Store Connect API key (.p8).
          if [ -n "${SIGN_IDENTITY:-}" ] && [ "$SIGN_IDENTITY" != "-" ] && [ -n "${NOTARY_KEY:-}" ]; then
            # REQUIRED (policy: a release must NEVER contain an un-notarized dmg). If notarytool
            # times out / Apple rejects, this step FAILS → the artifact upload is skipped → no macOS
            # dmg in the release (rather than an un-notarized one). During an Apple notary outage
            # this leg fails until Apple recovers — re-run then.
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/nkey.p8"
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/nkey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
              --wait --timeout 45m
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG" && echo "notarized + stapled OK"
            rm -f "$RUNNER_TEMP/nkey.p8"
          else
            echo "notary creds not set (or ad-hoc signature) — skipping notarization (fork build)"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: qt-macos-universal
          path: desktop/desktop-qt/out/*

  # ── Windows: x64 via MSYS2/MINGW64. pacman provides gcc + **静态 Qt6**(qt6-static)+ OpenSSL
  # + opus/libsodium/openh264/libsrtp (all with pkg-config), so libdatachannel's DTLS finds
  # OpenSSL and the core links the codecs via pkg-config (the CMake MSYS2 branch). Qt 编进 exe,
  # 不再有 windeployqt / DLL 闭包;源仓 desktop/desktop-qt/installer/ 的自制安装器把它压成一个自解压 setup.exe
  # (2026-07-26 起取代 NSIS —— MUI2 DPI 不感知,高缩放机器上整窗被拉伸)。─────────────
  windows:
    name: Windows Qt (x64, MSYS2 → installer)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git curl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-static
            mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-opus mingw-w64-x86_64-libsodium mingw-w64-x86_64-openh264
            mingw-w64-x86_64-openssl mingw-w64-x86_64-libsrtp

      # ── Windows 的 Qt 是**静态**的(源仓 qt 9.14.344)────────────────────────────────
      # `mingw-w64-x86_64-qt6-static` 是 MSYS2 打好的整包静态 Qt(单包含 base/declarative/
      # 5compat/shadertools/websockets/imageformats/tools,前缀 /mingw64/qt6-static,约 2.7GB
      # 装完)。三条腿里只有这条能直接装现成的 —— mac / Linux 得走 qt-static.yml 自编。
      #
      # ⚠️ **动态的 qt6-base / qt6-imageformats 也必须装,装的不是 Qt 而是它们的第三方依赖闭包。**
      # 静态 Qt 的 CMake 配置在**链接期**要求这些第三方全部可见:WrapSystemPNG / WrapFreetype /
      # WrapSystemHarfbuzz / WrapPCRE2 / WrapSystemMd4c / WrapZSTD / double-conversion / icu /
      # sqlite3(以上来自 qt6-base),以及 **TIFF / WrapWebP**(来自 qt6-imageformats —— Qt6Gui
      # 在静态构建下会把 imageformats 插件全集链进来,qtiff/qwebp 于是把 libtiff/libwebp 变成
      # 我们的链接期依赖)。动态时代这些统统是 Qt6Gui.dll 自己的事,与我们无关。
      #
      # 两次实证(都是 configure 直接 `Failed to find required Qt component "Gui"`,真正的原因
      # 在紧挨着的上一行):Build All run 30941213539 = `Could NOT find WrapSystemPNG`(删了
      # qt6-base);qt-desktop run 30942523400 = `Could NOT find TIFF` + `WrapWebP`(只补了
      # qt6-base)。**规则:静态 kit 里我们会链到的每个模块,都要装它的动态同名包取依赖闭包。**
      # 用依赖闭包而不是手抄一份 Wrap*/lib* 清单:手抄的那种每次 Qt 升级都会悄悄过期。
      #
      # 两套 Qt 同时在机器上的风险(find_package 命中哪一套)由两道闸挡住:
      #   ① configure 显式 `-DQt6_DIR=/mingw64/qt6-static/lib/cmake/Qt6` —— Qt6Config 找组件时
      #      是 `NO_DEFAULT_PATH` 地在自己那棵树里找,Qt6 本体定死了,组件就不可能跨树;
      #   ② 构建后那条「SChat.exe 导入表里不许有 qt6*.dll」的断言,真串了也发不出去。

      - name: Fetch third-party deps (libdatachannel source + single headers)
        working-directory: desktop/desktop-qt
        run: bash third_party/fetch_deps.sh

      - name: Configure + build (Release, static Qt)
        working-directory: desktop/desktop-qt
        run: |
          set -e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64/qt6-static \
            -DQt6_DIR=/mingw64/qt6-static/lib/cmake/Qt6 \
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build -j"$(nproc)"

      # 「编出来了」不等于「静态成了」。判据直接查导入表,与安装器那三个 exe 的断言同款:
      # 系统 DLL 没有 lib 前缀、Qt DLL 一律 Qt6*.dll —— 两类都不该出现在 SChat.exe 里。
      # 放松这条的代价与源仓 9.12.325 那次一模一样:安装目录里重新躺回一堆 DLL,一键升级
      # 覆盖正在映射的镜像失败 → 「点了更新、重启后还是老版本」。
      #
      # ⚠️ **libssl/libcrypto 是唯一的例外,而且不能靠 OPENSSL_USE_STATIC_LIBS 消掉。**
      # 那个开关只管 libdatachannel 的 DTLS(它是编译期链接,已改成静态);Qt 的 TLS 后端
      # 是**运行期 dlopen**,与链接方式无关 —— 装目录里必须躺着这两个 DLL,否则每一次
      # https/wss 都在登录前静默失败。所以它们出现在导入表里也是可接受的(视 MSYS2 的
      # openssl 包有没有提供 .a 而定),但除它俩之外一个都不许有。
      - name: Assert SChat.exe 零 Qt/MinGW 运行时 DLL 依赖
        working-directory: desktop/desktop-qt
        run: |
          set -e
          objdump -p build/app-qt/SChat.exe | awk '/DLL Name:/ { print tolower($3) }' | sort -u > /tmp/imports.txt
          cat /tmp/imports.txt
          bad=$(grep -E '^(lib|qt6)' /tmp/imports.txt | grep -vE '^lib(ssl|crypto)-' || true)
          if [ -n "$bad" ]; then
            echo "FATAL: SChat.exe 仍动态依赖: $bad"
            echo "       (CMAKE_PREFIX_PATH 没指到 /mingw64/qt6-static?或 app-qt/CMakeLists.txt 的"
            echo "        SCHAT_QT_STATIC 分支没生效 —— 那三个 -static 开关必须同时在)"
            exit 1
          fi
          echo "OK: SChat.exe 除 OpenSSL 外零第三方 DLL"

      # 安装器的三个非 Qt 产物必须**零第三方 DLL 依赖**。放松这一条的代价(源仓 qt 9.12.325
      # 实证):setup.exe 动态依赖 libgcc_s_seh-1.dll,而更新器起它时的当前目录 = 安装目录
      # (app 由快捷方式启动,CWD 一路继承),Windows 的 DLL 搜索顺序里当前目录排在 PATH 之
      # 前 —— 安装器把「即将被覆盖的那个 DLL」映射进了自己进程,于是静默升级必然失败,bat
      # 照常重启旧 exe:用户点了更新、重启后还是老版本。顺带,干净机器上双击安装包会直接
      # 0xC0000135 起不来(开发机 PATH 上有 Git 的 mingw64\bin 兜着,看不出来)。
      # 系统 DLL 没有 lib 前缀,MinGW 运行时全有 —— 判据就这么简单。
      - name: Assert installer exes have no third-party DLL imports
        working-directory: desktop/desktop-qt
        run: |
          set -e
          fail=0
          for f in build/installer/SChatSetup.exe build/installer/uninstall.exe build/installer/mkpkg.exe; do
            bad=$(objdump -p "$f" | awk '/DLL Name:/ { print tolower($3) }' | grep -E '^lib' || true)
            if [ -n "$bad" ]; then
              echo "FATAL: $f 仍动态依赖: $bad(应静态链,见 installer/CMakeLists.txt 的 SCHAT_SETUP_STATIC_LINK)"
              fail=1
            else
              echo "OK: $f 只导入系统 DLL"
            fi
          done
          [ "$fail" = 0 ]

      - name: Package installer (静态 Qt + 自制 mkpkg)
        working-directory: desktop/desktop-qt
        run: |
          set -e
          VER=$(grep -E 'kVersion = "[^"]+"' core/include/schat/Version.h | sed -E 's/.*"([^"]+)".*/\1/')
          STAGE="pkg/SChat"
          mkdir -p "$STAGE" out
          cp build/app-qt/SChat.exe "$STAGE/"
          # ── windeployqt 已整段移除(源仓 qt 9.14.344)────────────────────────────────
          # Qt 静态之后它无事可做:没有 Qt6*.dll 要拷、没有 qml/ 目录要部署、没有 plugins/ 要
          # 挑,连那行救过命的 qt.conf 也失去意义(QML 模块与插件都编进了 exe,引擎不再按
          # 相对路径去磁盘上找)。**别因为「历史上一直有」把它加回来**:对静态 exe 跑
          # windeployqt 要么报错要么空跑,只会让日志看起来像成功了。
          # 与之一起消失的:qmlimportscanner 的 PATH/cygpath 那套绕行、--qmldir 扫描失败的手工
          # 回退清单、Qt6QuickControls2 等十几个 DLL 的手抄名单。qmlimportscanner 现在由 CMake
          # 在链接期调用(qt_import_qml_plugins),漏扫的表现从「运行期缺模块」提前成了链接错误。
          #
          # OpenSSL 的 DLL 仍然要拷:MSYS2 的静态 Qt 与官方一样用 -openssl-runtime,TLS 后端是
          # **运行期 dlopen** libssl/libcrypto 的 —— 这部分不因为 Qt 静态而改变,缺了就是所有
          # https/wss 在登录前静默失败(与 macOS 那条同源)。
          for d in libssl-3-x64 libcrypto-3-x64 libssl-3 libcrypto-3; do
            [ -f "/mingw64/bin/$d.dll" ] && cp "/mingw64/bin/$d.dll" "$STAGE/" || true
          done
          ls "$STAGE"/libssl* "$STAGE"/libcrypto* 2>/dev/null || echo "WARN: no openssl DLLs staged"
          # 语音转文字引擎运行库(sherpa-onnx C API + onnxruntime,官方 MSVC 预编译,MT=静态
          # CRT):AsrEngine 运行时 LoadLibrary exe 旁的 sherpa-onnx-c-api.dll;缺失仅「转文字」
          # 不可用(SenseVoice 模型本体 ~163MB 由应用首次使用时下载,不进安装包)。
          SHERPA_VER=1.13.4
          curl -fsSL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VER}/sherpa-onnx-v${SHERPA_VER}-win-x64-shared-MT-Release-no-tts-lib.tar.bz2" -o /tmp/sherpa.tar.bz2
          mkdir -p /tmp/sherpa && tar -xf /tmp/sherpa.tar.bz2 -C /tmp/sherpa --strip-components=1
          cp /tmp/sherpa/lib/*.dll "$STAGE/"
          ls "$STAGE"/sherpa-onnx-c-api.dll "$STAGE"/onnxruntime.dll
          # ── DLL 闭包已整段移除,判据**反过来了**(源仓 qt 9.14.344)────────────────────
          # 动态时代这里要把 ~90 个 /mingw64 运行时 DLL 递归解全(MinGW 运行时三件套、ICU、
          # harfbuzz/freetype/pcre2/glib/brotli/zlib/png/md4c、codec、以及只在 LoadLibrary 时才
          # 出现的插件自身依赖如 sqldrivers→libsqlite3-0),漏一个 = 干净机器上启动即退、stderr
          # 全空。静态之后这批依赖**整体不存在**:Qt、ICU、codec、sqlite 全编进 exe,MinGW
          # 运行时由 -static 收进去。
          #
          # 于是断言从「这三个 DLL 必须在」翻转成「一个 lib*.dll 都不许在」——
          # ⚠️ **这个翻转是有意的,别看到旧注释里写着 `FATAL: libgcc_s_seh-1.dll missing` 就以为
          # 是退化。** 保留一条断言而不是干脆不检查,是因为安装目录里只要重新出现这几个 DLL,
          # 9.12.326 那条根因就会原样复活:一键升级时 setup.exe 从安装目录把它们映射进自己进程,
          # 覆盖正在映射的镜像被系统禁止 → 用户点了更新、重启后还是老版本。
          cp build/installer/uninstall.exe build/installer/SChatSetupUI.exe "$STAGE/"
          echo "staged files: $(find "$STAGE" -type f | wc -l)"
          find "$STAGE" -type f | sort
          # 允许存在的非系统 DLL 只有两类:OpenSSL(Qt TLS 后端运行期 dlopen)与 sherpa/onnxruntime
          # (AsrEngine 运行期 LoadLibrary,官方 MSVC 预编译、MT 静态 CRT,与 MinGW 无关)。
          bad=$(find "$STAGE" -maxdepth 1 -iname 'lib*.dll' \
                  ! -iname 'libssl-*.dll' ! -iname 'libcrypto-*.dll' -printf '%f\n' || true)
          if [ -n "$bad" ]; then
            echo "FATAL: 安装目录里出现了不该有的 MinGW/Qt 运行时 DLL:"
            echo "$bad"
            echo "       静态链没生效 —— 见 app-qt/CMakeLists.txt 与 installer/CMakeLists.txt 的"
            echo "       -static -static-libgcc -static-libstdc++,以及 CMAKE_PREFIX_PATH。"
            exit 1
          fi
          echo "OK: 安装目录零 MinGW/Qt 运行时 DLL"
          # ── 自制安装器(源仓 desktop/desktop-qt/installer/,已取代 NSIS)────────────────
          # 换掉 NSIS 的理由不是「不好看」而是**MUI2 DPI 不感知**:150% 缩放的机器上整窗被
          # 系统位图拉伸,上一版精心生成的 164×314 侧栏被拉成 246×471,贴什么图都糊。
          # 自制的这套:stub 与卸载器不链 Qt(静默升级路径因此不依赖任何 Qt 落地),界面是
          # 一页式 QML,首帧前由 stub 画原生启动图顶着。细节见 docs/build_and_run.md。
          #
          # ── 「引导子集」现在就是一个文件(源仓 qt 9.14.344)──────────────────────────
          # 它原本的定义是「把 SChatSetupUI.exe 起得来所需的那批 Qt DLL 挑出来,排在 solid 流
          # 最前面,好让 stub 只解压前缀就能起界面」。静态 Qt 之后 SChatSetupUI.exe 自足,引导
          # 子集 = 它自己,scan/blunt 两条造法与那套 qmlimportscanner / cygpath / qt.conf 绕行
          # 全部随之作废(它们解决的问题是「部署布局里 QML 模块放哪」,而现在 QML 编进了 exe)。
          # 首帧因此更快:引导阶段只需解压一个 ~40MB 的文件,而不是 77~1653 个小文件。
          #
          # **--selftest 保留,而且比以前更重要。** 它验的是「这套东西真能把 QML 加载起来」,
          # 静态构建同样会漏:qmlimportscanner 在链接期漏扫一个模块,exe 照样编得出来,运行时
          # 才报 `module "X" is not installed`。存在性检查(文件在不在)从来挡不住这类问题,
          # 9.12.323 那次 76 文件精简集就是被 selftest 拦下的 —— 换成没有它的世界,发出去的是
          # 一个双击打不开的安装器,而 CI 全绿。
          BOOT="pkg/boot"
          rm -rf "$BOOT"; mkdir -p "$BOOT"
          cp build/installer/SChatSetupUI.exe "$BOOT/"
          # GUI 子系统进程的 Qt 日志默认走 OutputDebugString,CI 日志里什么都看不见 ——
          # QT_ASSUME_STDERR_HAS_CONSOLE=1 让失败原因(QQmlApplicationEngine 的 warnings,
          # 比如 "module X is not installed")落进 stderr;失败时再带 QML_IMPORT_TRACE 复跑
          # 一遍,把 import 解析现场也打出来,别再让 selftest 静默失败逼人盲猜。
          ( cd "$BOOT" && QT_ASSUME_STDERR_HAS_CONSOLE=1 ./SChatSetupUI.exe --selftest ) || {
            echo "selftest 失败,带 QML_IMPORT_TRACE 复跑拿现场:"
            ( cd "$BOOT" && QT_ASSUME_STDERR_HAS_CONSOLE=1 QML_IMPORT_TRACE=1 \
                ./SChatSetupUI.exe --selftest 2>&1 | tail -n 40 ) || true
            echo "FATAL: 安装界面加载不起 QML(用户机上会双击打不开)"
            exit 1
          }
          echo "selftest OK: $(find "$BOOT" -type f | wc -l) files, $(du -sh "$BOOT" | cut -f1)"

          # mkpkg 求两棵树的并集:两边都有的文件只存一份(引导时解到 %TEMP%、安装时写进
          # 安装目录),并把引导子集排到 solid LZMA 流的最前面,好让 stub 只解压前缀就能起界面。
          mkdir -p out
          build/installer/mkpkg.exe \
            --stub build/installer/SChatSetup.exe \
            --app "$STAGE" \
            --boot "$BOOT" \
            --out "out/SChat-windows-${VER}-x64-setup.exe" \
            --version "$VER"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: qt-windows-x64
          path: desktop/desktop-qt/out/*

  # ── Linux: x86_64 + aarch64, built + packaged in Debian trixie containers.
  # Qt 不再来自 trixie 的系统包,而是 qt-static.yml 预编译的静态 kit(容器仍是 trixie,
  # glibc 与编 Qt 那一侧一致)。Produces a .deb (both arches) and, on x86_64, a
  # self-contained AppImage — via scripts/ci-linux-pkg.sh in the source repo. Both arches run
  # natively on matching runners. (armhf/QEMU dropped 2026-07-15 — 每次多拖 ~1h 且无真实用户。)
  linux:
    name: Linux Qt (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64,  image: "debian:trixie",         platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, image: "arm64v8/debian:trixie", platform: linux/arm64 }
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}

      - name: Build + package (.deb + AppImage) in Debian trixie (${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e SCHAT_GH_MIRROR -e SCHAT_RAW_MIRROR -e SCHAT_QT_STATIC_VER -e ARCH=${{ matrix.arch }} \
            -v "$PWD:/src" -w /src/desktop/desktop-qt \
            ${{ matrix.image }} bash scripts/ci-linux-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qt-linux-${{ matrix.arch }}
          path: desktop/desktop-qt/out/*

  # NOTE: no release job here on purpose — the three build jobs above only upload artifacts.
  # build.yml ("Build All") calls this workflow and its own release job bundles the Qt desktop
  # artifacts into the single combined release. A standalone workflow_dispatch just produces the
  # artifacts (downloadable from the run) for desktop-only test builds.
