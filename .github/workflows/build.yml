name: Build All

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ireoo/Secret-Chat 的分支或标签"
        required: false
        # 打包只用 `main`:版本分支(v9.12 / v9.13 …)开发完成后 fast-forward 合并进 main,
        # 发布一律从 main 打(main 已含 desktop/desktop-qt 与 chatserver)。要临时打某个版本分支,
        # 用 workflow_dispatch 显式传 ref 覆盖即可。
        default: "main"
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  SRC_REPO: Ireoo/Secret-Chat
  SRC_REF: ${{ github.event.inputs.ref || 'main' }}
  # GitHub-hosted runners reach github.com directly — skip the gh-proxy.com mirror (China-only)
  # that third_party/fetch_deps.sh defaults to (it's slow/blocked from the runners).
  SCHAT_GH_MIRROR: https://github.com
  SCHAT_RAW_MIRROR: https://raw.githubusercontent.com

jobs:
  # ── 发布门禁(2026-08-12 新增)────────────────────────────────────────────────
  #
  # 此前**整条流水线一个测试都不跑**(7 个 job 里没有 go test / swift test /
  # gradlew test / qt 测试二进制),`qt-desktop.yml` 里也只跑一个安装器回归。
  # 也就是说仓库里全部单测、以及那十几套跨端差集守卫,只在有人本机手动跑时才有效 ——
  # 流水线会照常构建、签名、发布一个测试全红的版本。
  #
  # 这个 job 只放**确定性高、不需要显示环境**的三样:跨端守卫 + chatserver + Android 单测。
  # **刻意不放**的与理由:
  #   - qt 的 65 个测试二进制:其中一部分要 QGuiApplication / 显示环境,
  #     放进发布门禁的 flaky 风险 > 收益(门禁一 flaky 就会挡住发版);
  #   - macOS / iOS:要 macOS runner,而那些 runner 已被构建腿占满;
  #   - 这三样在本机由 `scripts/run-all-tests.sh` 覆盖(它会跑全部五端)。
  # 覆盖边界写在这里,免得有人以为「CI 绿 = 全端都验过」。
  tests:
    name: Tests (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: chatserver/go.sum
      # ★ 根治 wrapper 下载失败:把 gradle 发行包缓存起来,命中就完全不碰
      #   services.gradle.org。#289 的 Tests(gate)就是被那台主机打红的 —— 重试只是
      #   降低概率,不下载才是真正不会失败。key 跟着 wrapper properties 走:
      #   换 gradle 版本自动失效,不会喂旧发行包。
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 跨端一致性守卫(SAS 闸门 / 共用固定向量 / 本地存储验证器自检)
        run: |
          python3 scripts/check-sas-gate.py
          python3 scripts/check-shared-fixtures.py
          # sync_probe 的 16 组内置自检 —— 零依赖、不碰任何真实数据、1 秒跑完。
          # 它此前**只在有人手动跑时有效**:16 组守卫一个门禁都没接,
          # 正是本仓「测试写了没人跑」那条老毛病的又一例。
          # 钉的是登记册 docs/local_storage_contract.md 的可执行部分:四端表名列名映射、
          # 账号身份归一的五种口径、判空/删除的边界、密文库摘要比对的固定向量。
          python3 scripts/sync_probe.py --selftest
      - name: chatserver (go test)
        working-directory: chatserver
        # ⚠️ 判据是**通过的包数**,不是「输出里没有 FAIL」——
        #    一个包都没跑到时同样没有 FAIL,那是这个仓库反复踩过的假绿。
        run: |
          set -o pipefail
          out=$(go test ./... 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          n=$(echo "$out" | grep -cE '^ok ') || true
          if [ "$n" -lt 5 ]; then
            echo "::error::只通过 $n 个包(期望 ≥5)—— 判据失配,不是「都通过了」"
            exit 1
          fi
      # ★ ShieldCode 的 golden 夹具(bin/ photo/)是**生成物且被 gitignore**(26 MB) ——
      #   本机流程是「先跑参考实现生成,再跑测试」,而 CI 从没做过这一步:
      #   于是 `ShieldCodeCodecTest` 在干净检出上必然 FileNotFoundException。
      #   这正是这道门禁第一次跑就逮到的东西 —— 那几条测试**在本机绿了很久,却从来跑不起来**。
      - name: 生成 ShieldCode 夹具(gitignore 的生成物)
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 docs/fixtures/shieldcode/tools/shieldcode_ref.py gen
          # vectors.json 是**已跟踪**的冻结向量:重生成后必须一字不差。
          # 变了 = 参考实现与冻结向量漂开了,那是真问题,不能默默拿新值继续测。
          git diff --quiet -- docs/fixtures/shieldcode/vectors.json || {
            echo "::error::重新生成后 vectors.json 变了 —— 参考实现与冻结向量已漂开"; exit 1; }

      - name: Android (unit tests)
        working-directory: android
        run: |
          chmod +x gradlew
          # gradle wrapper 会去 services.gradle.org 取发行包,那一步**自己没有任何重试** ——
          # Build All #281 的 Android 腿就是被一次 `SocketException: Unexpected end of file
          # from server` 打红的(和同一次里 Qt aarch64 腿的 503 是同一个病根:外部下载零重试)。
          # 先带重试地预热一次 wrapper,再跑真正的构建。
          d=2
          for i in 1 2 3 4 5 6; do
            ./gradlew --version --no-daemon >/dev/null 2>&1 && break
            echo "::warning::gradle wrapper 没下下来(第 $i 次),${d}s 后重试"
            sleep "$d"; d=$((d * 2))
          done
          ./gradlew --version --no-daemon >/dev/null 2>&1 || {
            echo "::error::gradle wrapper 连试五次都没下下来 —— services.gradle.org 不可达"; exit 1; }
          ./gradlew :app:testDebugUnitTest --console=plain

  # iOS 不在 CI 构建——本地 archive 后直传 TestFlight（见项目根 CLAUDE.md / 记忆）。
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}
      # ★ 根治 wrapper 下载失败:把 gradle 发行包缓存起来,命中就完全不碰
      #   services.gradle.org。#289 的 Tests(gate)就是被那台主机打红的 —— 重试只是
      #   降低概率,不下载才是真正不会失败。key 跟着 wrapper properties 走:
      #   换 gradle 版本自动失效,不会喂旧发行包。
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # gradle wrapper 会去 services.gradle.org 取发行包,那一步**自己没有任何重试** ——
          # Build All #281 的 Android 腿就是被一次 `SocketException: Unexpected end of file
          # from server` 打红的(和同一次里 Qt aarch64 腿的 503 是同一个病根:外部下载零重试)。
          # 先带重试地预热一次 wrapper,再跑真正的构建。
          d=2
          for i in 1 2 3 4 5 6; do
            ./gradlew --version --no-daemon >/dev/null 2>&1 && break
            echo "::warning::gradle wrapper 没下下来(第 $i 次),${d}s 后重试"
            sleep "$d"; d=$((d * 2))
          done
          ./gradlew --version --no-daemon >/dev/null 2>&1 || {
            echo "::error::gradle wrapper 连试五次都没下下来 —— services.gradle.org 不可达"; exit 1; }
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p out
          VER=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp android/app/build/outputs/apk/debug/*.apk out/SChat-android-debug.apk
          cp android/app/build/outputs/apk/release/*.apk "out/SChat-android-release-${VER}.apk" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  # Desktop packaging — replaces the deleted Electron client. mac 有**两条并存的腿**:原生
  # SwiftUI 苹果特效版(desktop/macos, arm64, macOS 14+)+ Qt/QML 通用兼容版(desktop/desktop-qt,
  # arm64+x86_64, minos 12.0 → macOS 12/13+ 与 Intel);Windows/Linux 是 Qt6/QML(NSIS via MSYS2 /
  # .deb + AppImage via Debian trixie)。四条腿都住在 REUSABLE qt-desktop.yml 里,在这里被调用,
  # so the combined release below bundles every desktop artifact (macos-swiftui(SwiftUI mac 包) /
  # qt-macos-universal(Qt 通用 mac 包) / qt-windows-x64 / qt-linux-{x86_64,aarch64,armhf})。
  # release 靠 download-artifact merge-multiple 自动收录本次 run 的全部 artifact,故加一条腿
  # 无需改 release job。Standalone `qt-desktop.yml` dispatch still runs the same build for tests.
  desktop:
    name: Desktop (mac SwiftUI / Win+Linux Qt)
    uses: ./.github/workflows/qt-desktop.yml
    permissions:
      contents: write
    with:
      # env context isn't available in a reusable call's `with:` — inline the ref default.
      ref: ${{ github.event.inputs.ref || 'main' }}
    secrets: inherit

  server:
    name: chatserver (single binary, linux amd64+arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: chatserver/go.sum
      - name: Build
        # chatserver is pure Go (pgx + modernc SQLite), so CGO_ENABLED=0 gives static
        # binaries and easy cross-compile to arm64.
        working-directory: chatserver
        run: |
          mkdir -p ../out
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../out/SChat-server-linux-amd64 .
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../out/SChat-server-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: out/*

  docker:
    name: chatserver Docker → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}
      # chatserver's multi-stage Dockerfile compiles Go in-container and does NOT COPY
      # config.yaml into the image (config is mounted at runtime via CHATSERVER_CONFIG), so
      # no placeholder seeding is needed (unlike the deleted nodeServer).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        env:
          # 不要上传 build-push-action 的 .dockerbuild 记录工件——它会成为 release 任务
          # download-artifact 的一个额外（失败时为 0 字节）工件，拖垮整个 Release。
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: chatserver
          push: true
          tags: |
            ghcr.io/integemjack/schat-server:latest
            ghcr.io/integemjack/schat-server:${{ env.SRC_REF }}-b${{ github.run_number }}

  m5core2:
    name: M5Stack Core2 (firmware)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-m5core2-${{ hashFiles('ESP32/m5core2/platformio.ini') }}
      - name: Build firmware (base env)
        working-directory: ESP32/m5core2
        # 普通 env(m5stack-core2):预编译核,纯 pio run,产 OTA-able firmware.bin。
        # 唤醒词/深度 light sleep 的 -ww 版需 model 分区(OTA 刷不了分区,必须 USB 首刷)+
        # custom_sdkconfig IDF 重编,是本地 ./build_pm.sh ww 烧录件,刻意不进 CI。
        run: pio run -e m5stack-core2
      - name: Collect firmware
        run: |
          mkdir -p out
          cp ESP32/m5core2/.pio/build/m5stack-core2/firmware.bin out/SChat-m5core2-firmware.bin
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: m5core2
          path: out/*

  release:
    name: Publish Release
    needs: [tests, android, desktop, server, docker, m5core2]
    # `always()` 保留 —— 某条构建腿失败时仍发布已经成功的那些产物(既有行为)。
    # **但测试没过就不发布**:门禁的意义就在这一行。
    if: always() && needs.tests.result == 'success' 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (changelog 用)
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}
          fetch-depth: 0
      - name: Build changelog (自上个 release 到本次的提交)
        id: cl
        run: |
          SRC_SHA=$(git rev-parse HEAD)
          PREV=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=20" | grep -oE 'src-sha:[0-9a-f]{7,40}' | head -1 | sed 's/src-sha://')
          if [ -n "$PREV" ] && git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
            LOG=$(git log "${PREV}..HEAD" --no-merges --pretty='- %s' | head -80)
          else
            LOG=$(git log -n 30 --no-merges --pretty='- %s')
          fi
          [ -z "$LOG" ] && LOG="- (无新提交)"
          {
            echo "body<<__CL__"
            echo "## 更新内容(自上个版本)"
            echo ""
            echo "$LOG"
            echo ""
            echo "<sub>build #${{ github.run_number }} · src-sha:${SRC_SHA}</sub>"
            echo "__CL__"
          } >> "$GITHUB_OUTPUT"
      # docker 任务已禁用 .dockerbuild 记录工件上传，这里只剩各端真实产物
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -laR dist || true
      # 非 main 分支 = **测试版**:GitHub release 打 prerelease 标记,且绝不占用 "Latest"。
      # 客户端据此分道:正式通道走 releases/latest(GitHub 定义上就排除 prerelease),
      # 打开「接收测试版(Beta)」的客户端才去 /releases 列表里取最新的那条(含 prerelease)。
      # 见 docs/update_distribution_plan.md 与三端的 beta 开关。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SRC_REF }}-b${{ github.run_number }}
          # ⚠️ GHA 的 `A && B || C` 三元里,**B 绝不能是空串/false** —— `true && ''` 求值成 `''`
          # 本身是 falsy,于是 `'' || C` 又落回 C:条件为真也照样拿到 C。原写法
          # `SRC_REF == 'main' && '' || ' · 测试版'` 因此让**从 main 打的正式版标题也带「测试版」**
          # (main-b184 实证;prerelease/make_latest 是直接比较,一直是对的,只有标题错)。
          # 规避法只有一条:把非空的那个值放进 B,条件取反。
          name: "SChat ${{ env.SRC_REF }} build ${{ github.run_number }}${{ env.SRC_REF != 'main' && ' · 测试版' || '' }}"
          body: ${{ steps.cl.outputs.body }}
          files: dist/**
          prerelease: ${{ env.SRC_REF != 'main' }}
          make_latest: ${{ env.SRC_REF == 'main' }}

      # ── Update distribution — sign each desktop/android asset with the official
      # Ed25519 key, attach this release's combined signed manifest (老客户端的回退源),
      # and merge this build into the version index published on the FIXED `version`
      # tag, which is the only thing new clients read
      # (docs/update_index_refactor_plan.md §4; signing口径 = update_distribution_plan.md §3).
      # The self-hosted jiami.chat upload leg is RETIRED — no token, no 100 MiB CDN cap.
      # continue-on-error so a hiccup never blocks the已发布 release; the gate step
      # right after turns the JOB red so report-failures opens an issue.
      # The release job checked out the SOURCE repo into the workspace, so the CI repo
      # (schat.build, where the signer lives) is checked out into a subpath.
      - name: Checkout schat.build (release signer)
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: _ci
      - name: Setup Go (release signer)
        if: always()
        continue-on-error: true
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false # signer is stdlib-only (no go.sum); nothing to cache
      - name: Sign release assets + merge the version index
        id: sign
        if: always()
        continue-on-error: true
        env:
          RELEASE_SIGN_ED25519_KEY: ${{ secrets.RELEASE_SIGN_ED25519_KEY }}
          # 非 main 分支 = 测试版 → 在索引里落一条**独立**的 channel=beta 条目(与 stable 那条
          # 并列,条目主键是 (line,os,arch,channel))。择道搬到了客户端:开关关 = 只看 stable,
          # 开 = {beta,stable} 里 publishedAt 较新的那个(超集,不是纯隔离 —— 否则正式版发布后
          # 没跟新测试版时,beta 用户会比正式用户还旧)。
          RELEASE_CHANNEL: ${{ env.SRC_REF == 'main' && 'stable' || 'beta' }}
          # 本次构建的 release tag —— 每个资产的 browser_download_url 都由它拼出来。
          # 它为空时 signer 直接 fatal:空值会产出一份「下载链接全 404 但 CI 全绿」的索引。
          RELEASE_TAG: ${{ env.SRC_REF }}-b${{ github.run_number }}
          RELEASE_REPO: ${{ github.repository }}
          # 读固定 tag 上的现有索引走 API(权威、绕开 CDN 缓存)。读不到且不是 404 一律 fatal ——
          # 从空索引重建会抹掉本次没构建的腿(qt-mac 那条腿历史上就时有时无),那些平台会**静默停更**。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The per-line changelog (same body attached to the GitHub release above) — lands in the
          # manifest/index `notes`+`body`. Without it the 更新说明 renders blank on all three ends.
          RELEASE_NOTES: ${{ steps.cl.outputs.body }}
        run: |
          cd _ci/tools/release-signer
          go run . \
            -dir "$GITHUB_WORKSPACE/dist" \
            -manifest "$GITHUB_WORKSPACE/schat-update-manifest.json" \
            -index "$GITHUB_WORKSPACE/version.json" \
            -index-manifest "$GITHUB_WORKSPACE/index/schat-update-manifest.json"
      - name: Attach signed manifest to GitHub release (老客户端的回退源)
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SRC_REF }}-b${{ github.run_number }}
          files: schat-update-manifest.json
      # ── 固定 tag `version` —— 三端唯一的更新索引(docs/update_index_refactor_plan.md §3)。
      # make_latest:false + prerelease:false 两个都是**载荷性**的,不是整洁性的:
      #   占了 "Latest" ⇒ 老客户端的 releases/latest 回退拿到一个没有构建产物的 release;
      #   标了 prerelease ⇒ 老客户端的 beta 回退(取 /releases 列表第 0 条)会撞上它。
      # 两种都把老客户端的更新链打断。同时放一份 stable-only 的 schat-update-manifest.json:
      # 万一有老客户端因为列表排序落到这个 release 上,它也能拿到合法签名清单,且拿到的是正式版。
      - name: Publish version index (fixed `version` tag)
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: version
          name: "版本索引 (version.json)"
          body: |
            三端(qt / macOS / Android)更新索引 —— 每次发布由 CI 自动覆盖,**不要手工编辑**。

            - `version.json` — schema 2,数组以 `(line, os, arch, channel)` 为主键,正式版与测试版并列。
            - `schat-update-manifest.json` — schema 1、仅正式版,给老客户端兜底。

            契约见源仓库 `docs/update_index_refactor_plan.md`。
          files: |
            version.json
            index/schat-update-manifest.json
          make_latest: false
          prerelease: false
      # 索引没更新 = 三端全部收不到本次发布。上面几步 continue-on-error 是为了不拖垮**已经发布**
      # 的 release,但这种失败绝不能绿着过去 —— 这里把 job 判红,report-failures 会开 issue。
      - name: Gate — the version index must have been updated
        if: always() && steps.sign.outcome == 'failure'
        run: |
          echo "::error::版本索引未更新 —— qt / macOS / Android 三端都不会看到本次发布"
          exit 1

  # 任何构建腿失败 → 在本仓库(schat.build)开/追评一个 issue;恢复绿 → 自动关闭。
  # 单 job 汇总:列本次 run 的全部 job(含 desktop 复用工作流的子腿 macOS/Windows/Linux),
  # 按 job 名去掉 reusable 的容器腿,用 issue body 里的隐藏指纹标记 `<!-- schat-ci-fp: build/<slug> -->`
  # 去重(每条腿至多一个 open issue,后续失败追评论)。issue 开在本仓库,GITHUB_TOKEN 即够,无需 PAT。
  report-failures:
    name: Report build failures
    # `release` 也在 needs 里:它的「索引未更新」闸门判红后必须被报出来。少了它,
    # report-failures 会与 release 并行跑,看到的 conclusion 还是 null(被下面的过滤跳过)。
    # `tests` 也在里面:门禁判红时必须被报出来(否则测试挂了只表现为「没发布」,没人知道为什么)。
    needs: [tests, android, desktop, server, docker, m5core2, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Open/close issues by leg result
        uses: actions/github-script@v7
        env:
          SRC_REF: ${{ env.SRC_REF }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const ref = process.env.SRC_REF || 'main';
            const SELF = 'Report build failures';

            // 本次 run 的全部 job —— 含 reusable(desktop)工作流的子腿。
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: runId, per_page: 100,
            });
            const legs = jobs.filter(j => j.name !== SELF && !j.name.startsWith(SELF + ' /'));
            const names = legs.map(l => l.name);
            // reusable 容器腿的名字是其子腿名的前缀(`X / Y`)——只报最具体的子腿,不报容器。
            const isContainer = (n) => names.some(o => o !== n && o.startsWith(n + ' / '));

            async function ensureLabel(name, color) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { try { await github.rest.issues.createLabel({ owner, repo, name, color }); } catch (e2) {} }
            }
            await ensureLabel('ci-failure', 'd73a4a');

            // 直接列(非 search,无索引延迟),按 body 里的隐藏指纹去重。
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'ci-failure', state: 'all', per_page: 100,
            });
            const findByFp = (fp) => existing.find(i => (i.body || '').includes(`<!-- schat-ci-fp: ${fp} -->`));

            for (const leg of legs) {
              if (isContainer(leg.name)) continue;
              if (!['success', 'failure'].includes(leg.conclusion)) continue; // 跳过 skipped/cancelled/进行中
              const slug = leg.name.replace(/[^a-zA-Z0-9]+/g, '-').replace(/(^-|-$)/g, '').toLowerCase();
              const fp = `build/${slug}`;
              const marker = `<!-- schat-ci-fp: ${fp} -->`;
              const issue = findByFp(fp);
              if (leg.conclusion === 'failure') {
                const title = `[CI] 构建失败: ${leg.name}`;
                const body = [
                  `**腿**: \`${leg.name}\``,
                  `**分支**: \`${ref}\``,
                  `**Run**: ${runUrl}`,
                  `**构建号**: #${context.runNumber}`,
                  ``,
                  `_同一条腿的后续失败会在此追加评论,恢复绿后自动关闭。_`,
                  ``,
                  marker,
                ].join('\n');
                if (issue) {
                  if (issue.state === 'closed') {
                    await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open' });
                  }
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issue.number,
                    body: `🔴 再次失败 · build #${context.runNumber} · ${runUrl}`,
                  });
                } else {
                  await github.rest.issues.create({ owner, repo, title, body, labels: ['ci-failure'] });
                }
              } else if (issue && issue.state === 'open') {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `✅ 已恢复 · build #${context.runNumber} · ${runUrl} — 自动关闭。`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }

