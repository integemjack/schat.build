name: Qt Static (prebuild)

# 从官方源码编**静态 Qt**,产物打成 tarball 挂到本仓库的 release 上,供 qt-desktop.yml 的
# mac / Linux 两条打包腿下载(desktop/desktop-qt/scripts/fetch-static-qt.sh)。
#
# 为什么要有这条独立工作流(2026-08-04,源仓 qt 9.14.344「Qt 全静态化」):
#   官方**不提供**静态 Qt 二进制(aqt 装的是动态 kit),Debian 也没有静态 Qt 包。三条腿里只有
#   Windows 能直接 `pacman -S mingw-w64-x86_64-qt6-static` 拿到现成的,mac / Linux 只能自编,
#   单份 40~90 分钟。挂进每条打包腿 = 每次发版多等一两个小时,所以拆出来**手动触发一次**、
#   产物复用,Qt 升版时才重跑。
#
# ⚠️ Qt 版本的选择不是「越新越好」,两条硬约束把它钉在 6.8 LTS:
#   ① **macOS 12**。mac-qt 这条腿的存在理由就是「minos 12.0,跑 macOS 12/13+ 与 Intel」
#      (qt-desktop.yml 的 macos-qt 注释)。Qt 6.9+ 官方最低支持已抬到 macOS 13 —— 用 6.11/6.12
#      编出来的东西再怎么设 CMAKE_OSX_DEPLOYMENT_TARGET=12.0 也只是嘴上说支持。6.8 LTS 官方
#      支持 macOS 12。
#   ② **QML 兼容下限 6.8**。这条下限本来由「Linux 用 trixie 的系统 Qt 6.8」决定,现在 Linux
#      改成自带静态 Qt,如果顺手升到 6.11,下限就悄悄抬走了 —— 而源仓所有 QML 都是按 6.8 写
#      的,且 Windows 那条腿仍是 MSYS2 的滚动版本。保持 6.8 = 这条铁律继续成立、三条腿的行为
#      不因为静态化而改变。**升版前先读 docs/build_and_run.md 里那段 6.9+ 属性会让下载包秒退
#      的记录。**
#
# 手动改 qt_version 时记得同步 desktop/desktop-qt/scripts/fetch-static-qt.sh 的默认值,
# 以及 qt-desktop.yml 的 SCHAT_QT_STATIC_VER。

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: "Qt 版本(必须在 download.qt.io/archive/qt 里有 single/ 源码包)"
        required: false
        default: "6.8.4"
      ref:
        description: "Ireoo/Secret-Chat 的分支或标签(只用来取依赖清单脚本)"
        required: false
        default: "main"
      platforms:
        description: "只编这几个(逗号分隔:macos-universal,linux-x86_64,linux-aarch64);留空=全编"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qt-static-${{ github.ref }}
  cancel-in-progress: false   # 编 Qt 很贵,别互相取消

env:
  QT_VER: ${{ inputs.qt_version || '6.8.4' }}
  SRC_REPO: Ireoo/Secret-Chat
  SRC_REF: ${{ inputs.ref || 'main' }}
  # 这一批 submodule 就是源仓真正用到的全部(逐条对应):
  #   qtbase        Core/Gui/Widgets/Network/Sql/**Test**(presence_test / auth_expired_test 链 Qt6::Test,
  #                 少了它 SCHAT_BUILD_APP=ON 的 configure 直接失败)
  #   qtshadertools QtQuick.Effects 与 Qt5Compat 的 graphicaleffectsprivate 插件都链它
  #   qtdeclarative Qml/Quick/Controls2/Layouts/Shapes/Dialogs2/Effects
  #   qtimageformats 头像等非 png/jpg 格式
  #   qtwebsockets  QtTransport 的 bare-WS
  #   qt5compat     Main.qml 的 Qt5Compat.GraphicalEffects(模糊)
  # **刻意不含 qtsvg / qtmultimedia**:全仓没有一处 import 或链接(图标是 QtQuick.Shapes 画的
  # 路径不是 .svg 文件;语音走 miniaudio + MF/ffmpeg)。动态时代 CI 顺手装了它俩,是历史包袱。
  QT_SUBMODULES: "qtbase,qtshadertools,qtdeclarative,qtimageformats,qtwebsockets,qt5compat"

jobs:
  # 单腿重跑用(某个平台编挂了、修完只想重编它):release 按 tag **追加**资产,已经成功的
  # 平台 tarball 留在原地不受影响,不必为了一条腿把三条全重来(每条 40~90 分钟)。
  # ⚠️ 必须走「上游 job 产出矩阵」这条路 —— job 级的 `if:` **拿不到 matrix 上下文**
  # (实测报 `Unrecognized named-value: 'matrix'`,连 dispatch 都会被 422 拒掉),
  # 别再试图把过滤写成 `if: contains(inputs.platforms, matrix.plat)`。
  plan:
    name: 选平台
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          PLATS: ${{ inputs.platforms }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          ALL = [
            # ⚠️ **runner 必须与 qt-desktop.yml 的 macos-qt 腿一致(现为 macos-14)。**
            # 静态 kit 会把「构建时 SDK 里有哪些符号」**烘焙进 .a**:在 macos-26(Xcode 26 SDK)
            # 编出来的 libqsecuretransportbackend.a 引用了 `_kSecImportToMemoryOnly`,而消费端
            # 跑 macos-14(Xcode 15.4 SDK)根本没有这个符号 → 链接期 undefined symbol
            # (Build All run 30941213539 实证,mac Qt 腿全红)。动态链接时这条耦合不存在,
            # 是静态化引入的新约束。改动任何一边的 runner,另一边必须同步改。
            {"plat": "macos-universal", "runner": "macos-14"},
            {"plat": "linux-x86_64",  "runner": "ubuntu-latest",    "image": "debian:trixie",         "platform": "linux/amd64"},
            {"plat": "linux-aarch64", "runner": "ubuntu-24.04-arm", "image": "arm64v8/debian:trixie", "platform": "linux/arm64"},
          ]
          want = [p.strip() for p in os.environ.get("PLATS", "").split(",") if p.strip()]
          bad = [p for p in want if p not in {m["plat"] for m in ALL}]
          # 打错一个平台名的默认后果是「矩阵变空、workflow 秒绿、release 上什么都没多」——
          # 那比编挂了还难发现,所以拼错直接失败。
          if bad:
              raise SystemExit(f"platforms 里有非法平台名: {bad}")
          sel = [m for m in ALL if not want or m["plat"] in want]
          print("matrix=" + json.dumps({"include": sel}))
          PY
          cat "$GITHUB_OUTPUT"

  build:
    name: static Qt ${{ inputs.qt_version || '6.8.4' }} · ${{ matrix.plat }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout source (依赖清单脚本)
        uses: actions/checkout@v4
        with:
          repository: Ireoo/Secret-Chat
          ref: ${{ env.SRC_REF }}
          token: ${{ secrets.SRC_REPO_TOKEN }}

      - name: Download Qt source
        run: |
          set -euo pipefail
          MINOR="$(echo "$QT_VER" | cut -d. -f1-2)"
          # 6.8 起官方源码包名带 -opensource-;更老的是 qt-everywhere-src-。两个都试。
          BASE="https://download.qt.io/archive/qt/${MINOR}/${QT_VER}/single"
          mkdir -p /tmp/qtsrc
          ok=0
          for n in "qt-everywhere-opensource-src-${QT_VER}.tar.xz" "qt-everywhere-src-${QT_VER}.tar.xz"; do
            if curl -fsSL "$BASE/$n" -o /tmp/qt.tar.xz; then echo "got $n"; ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "FATAL: $BASE 下没有可用的源码包"; exit 1; }
          tar -xJf /tmp/qt.tar.xz -C /tmp/qtsrc --strip-components=1
          ls /tmp/qtsrc | head

      # ── macOS: 一次 configure 出 Universal2(x86_64 + arm64)────────────────────────
      # Qt 6.2+ 原生支持 universal:CMAKE_OSX_ARCHITECTURES 给两个架构即可,**不要**编两遍再
      # lipo —— Qt 的 CMake 包里记着一堆绝对路径与架构相关的配置,lipo 只合并 .a 不合并那些,
      # 拼出来的 kit 会在 find_package 阶段就自相矛盾。(与源仓 brew 依赖那条「两架构 bottle
      # 须统一 install_name 再 lipo」不是一回事:那说的是第三方 dylib。)
      - name: Build static Qt (macOS universal)
        if: matrix.plat == 'macos-universal'
        run: |
          set -euo pipefail
          brew install ninja
          PREFIX=/tmp/qt-static-out
          cd /tmp/qtsrc

          # ── 补 Qt 6.8.4 × Xcode 26 clang 的一处硬不兼容(**删掉这段 macOS 腿必红**)──────
          # qyieldcpu.h 的第一个分支是 `#if __has_builtin(__yield) → __yield();`。clang 在 arm64
          # 上 __has_builtin(__yield) 恒真,但 `__yield` 是**库 builtin**(声明在 <arm_acle.h>),
          # 不是编译器关键字 builtin —— 不 include 那个头就是「隐式声明库函数」,老 clang 只警告,
          # 新 clang 默认提成 error。universal 的 -arch arm64 那一遍于是在 Bootstrap 就炸;
          # x86_64 那一遍走 __builtin_ia32_pause 分支,所以只在 arm64 上出现。Linux/GCC 不受影响
          # (GCC 的 __has_builtin(__yield) 为假,走 __builtin_arm_yield),故只在 mac 这条腿打。
          #
          # ⚠️ **别再试 `-DCMAKE_C_FLAGS=-Wno-error=...`**(run 30924782042 实证无效):flag 确实
          # 进了 CMake 缓存,但 **Qt 自己的构建系统会覆盖 CMAKE_CXX_FLAGS**,编译命令行上只剩
          # Qt 自己的 -Wall -Wextra,那条根本没到编译器。也别用 `-include arm_acle.h`:universal
          # 的 x86_64 那一遍找不到这个头。只有改源码这一条路走得通。
          YH=qtbase/src/corelib/thread/qyieldcpu.h
          if grep -q 'arm_acle.h' "$YH"; then
            echo "qyieldcpu.h 已含 arm_acle.h —— Qt 大概修好了这处,可以考虑删掉这段补丁"
          else
            # 锚点/用法任一对不上就失败:补丁静默 no-op 比补丁不存在更糟(下一步才炸,而且
            # 报错指向的是编译器不是这里)。
            grep -q '__yield();' "$YH" || { echo "FATAL: $YH 里已经没有 __yield() —— 请重新评估这段补丁"; exit 1; }
            python3 - "$YH" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          anchor = "#include <QtCore/qtconfigmacros.h>\n"
          if anchor not in s:
              raise SystemExit("FATAL: qyieldcpu.h 的 include 锚点不在了,补丁无法安全插入")
          patch = (anchor + "\n"
                   "// schat.build/qt-static.yml: __yield() 是声明在 <arm_acle.h> 里的库 builtin,\n"
                   "// 不 include 它在新 clang 上是 error 而非 warning。\n"
                   "#if defined(Q_PROCESSOR_ARM) && defined(Q_CC_CLANG)\n"
                   "#  include <arm_acle.h>\n"
                   "#endif\n")
          open(p, "w").write(s.replace(anchor, patch, 1))
          print("patched:", p)
          PY
            grep -n 'arm_acle' "$YH"
          fi

          ./configure -static -release -opensource -confirm-license \
            -prefix "$PREFIX" \
            -nomake examples -nomake tests \
            -submodules "$QT_SUBMODULES" \
            -openssl-runtime \
            -- \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build . --parallel
          cmake --install .

      # ── Linux: 在 Debian trixie 容器里编,glibc 与打包腿完全一致 ────────────────────
      # 依赖清单来自源仓 scripts/linux-static-qt-deps.sh —— **编 Qt 与链 Qt 必须同一份**,
      # 否则会出现「Qt 编进了 xcb 支持、打包机上却没有 libxcb-dev」这种链接期才炸的漂移。
      - name: Build static Qt (Linux ${{ matrix.plat }})
        if: matrix.plat != 'macos-universal'
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -v /tmp/qtsrc:/qtsrc -v /tmp:/out -v "$PWD:/src" \
            -e QT_SUBMODULES \
            ${{ matrix.image }} bash -euxc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              . /src/desktop/desktop-qt/scripts/linux-static-qt-deps.sh
              apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build python3 perl pkg-config file \
                $SCHAT_QT_STATIC_APT $SCHAT_APP_APT
              cd /qtsrc
              ./configure -static -release -opensource -confirm-license \
                -prefix /out/qt-static-out \
                -nomake examples -nomake tests \
                -submodules "$QT_SUBMODULES" \
                -xcb -bundled-xcb-xinput \
                -openssl-runtime
              cmake --build . --parallel "$(nproc)"
              cmake --install .
            '

      # 「编出来了」不等于「是静态的」:configure 的 -static 若因为某个依赖被悄悄降级,
      # 后果是三个月后才有人发现发布包里少了 Qt 运行时。就地验,不留给下游。
      - name: Verify it really is a static kit
        run: |
          set -euo pipefail
          P=/tmp/qt-static-out
          [ -f "$P/lib/cmake/Qt6/Qt6Config.cmake" ] || { echo "FATAL: 没有 Qt6Config.cmake"; exit 1; }
          # ⚠️ 断言里别写 `grep … | grep -q`:pipefail 下两段 grep 的退出码会互相掩盖,
          # 出来的是假阴性(源仓 macos-x86_64 那次交叉构建就栽在这个写法上)。落成中间文件再判。
          grep -rhs "QT6_IS_SHARED_LIBS_BUILD" "$P/lib/cmake/Qt6/" > /tmp/sharedflag.txt || true
          cat /tmp/sharedflag.txt
          if grep -iE '"(on|true|1)"' /tmp/sharedflag.txt; then
            echo "FATAL: 这是动态 kit"; exit 1
          fi
          # 失败时要有完整现场,别再为了看一眼目录长什么样重编 70 分钟。
          echo "=== $P/lib 顶层 ==="; ls "$P/lib" | head -40

          # ⚠️ **别按文件名判断**(run 30928889131 就是这么挂的):macOS 上 Qt 即使静态构建
          # 也按 **framework 布局**安装,产物是 lib/QtCore.framework/Versions/A/QtCore 而不是
          # lib/libQt6Core.a —— 写死 Linux 的文件名,mac 腿在 Qt 编了 70 分钟之后才因为一条
          # `ls` 失败。判据改成查**真实属性**:那个文件是不是静态归档(ar archive)。
          CORE=""
          for c in "$P/lib/libQt6Core.a" \
                   "$P/lib/QtCore.framework/Versions/A/QtCore" \
                   "$P/lib/QtCore.framework/QtCore"; do
            [ -f "$c" ] && { CORE="$c"; break; }
          done
          [ -n "$CORE" ] || { echo "FATAL: 找不到 QtCore 产物(上面的目录列表是现场)"; exit 1; }
          echo "QtCore = $CORE"
          file "$CORE" > /tmp/corefile.txt; cat /tmp/corefile.txt
          # 静态 = ar archive;动态 = "dynamically linked shared library"。这条才是真判据。
          if grep -qi "shared library\|dynamically linked" /tmp/corefile.txt; then
            echo "FATAL: QtCore 是动态库,不是静态归档"; exit 1
          fi
          grep -qi "archive" /tmp/corefile.txt || { echo "FATAL: QtCore 不是 ar 归档,形态不对"; exit 1; }
          # 整个 kit 里都不该出现 Qt 的共享库(mac 的 .dylib / Linux 的 .so)。
          find "$P/lib" \( -name 'libQt6*.so*' -o -name 'libQt6*.dylib' \) -print > /tmp/shared.txt
          if [ -s /tmp/shared.txt ]; then echo "FATAL: kit 里有 Qt 共享库:"; cat /tmp/shared.txt; exit 1; fi
          if [ "${{ matrix.plat }}" = "macos-universal" ]; then
            # 两个架构都得在 —— 少一个的表现是 Intel Mac 用户下载到一个打不开的包。
            lipo -info "$CORE" > /tmp/lipo.txt; cat /tmp/lipo.txt
            grep -q x86_64 /tmp/lipo.txt || { echo "FATAL: 缺 x86_64 slice"; exit 1; }
            grep -q arm64  /tmp/lipo.txt || { echo "FATAL: 缺 arm64 slice"; exit 1; }
          fi
          echo "OK: 静态 kit"

      - name: Pack tarball
        run: |
          set -euo pipefail
          ASSET="qt-static-${QT_VER}-${{ matrix.plat }}.tar.xz"
          mkdir -p /tmp/assets
          # --strip-components=1 在解压侧,所以这里必须**带一层顶层目录**打包。
          tar -C /tmp -cJf "/tmp/assets/$ASSET" qt-static-out
          if command -v sha256sum >/dev/null; then
            (cd /tmp/assets && sha256sum "$ASSET" > "$ASSET.sha256")
          else
            (cd /tmp/assets && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          fi
          ls -la /tmp/assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: qt-static-${{ env.QT_VER }}
          name: Static Qt ${{ env.QT_VER }}
          # 这是构建依赖不是产品发布,标成 prerelease 免得混进「最新版本」的判定里
          # (源仓的更新器按 /releases 列表挑资产,latest 的定义会跳过 prerelease)。
          prerelease: true
          body: |
            预编译**静态 Qt ${{ env.QT_VER }}**,给 `qt-desktop.yml` 的 mac / Linux 打包腿用。
            由 `desktop/desktop-qt/scripts/fetch-static-qt.sh` 下载校验。

            submodules: `${{ env.QT_SUBMODULES }}`
            (不含 qtsvg / qtmultimedia —— 源仓没有任何一处 import 或链接它们)

            Windows 不在这里:那条腿用 MSYS2 的 `mingw-w64-x86_64-qt6-static` 包。
          files: |
            /tmp/assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
