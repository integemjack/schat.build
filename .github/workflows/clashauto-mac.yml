# 在 schat.build（已配好 Developer ID 签名/公证 secret）里构建 ClashrAuto/clashauto 的 macOS
# 包，签名+公证后发布到 **ClashrAuto/Coast** 的 Release。避免把证书 secret 复制到源仓库。
#
# ★ 2026-08-10 起，【检出的仓库】与【发布的仓库】是两个：源码仍在
#   ClashrAuto/clashauto（那边即将转私有），而**发布/下载入口已迁到 ClashrAuto/Coast** ——
#   Coast 里住着一份由 release.yml 生成的 build.yml，六个平台的包都发在它自己名下。
#   本文件只改**发布落点**，`actions/checkout` 仍指向源仓库。
#
# ★ 2026-08-01 起构建 **Swift 版**（macos/ 下的 Coast.app）—— macOS 只发 Swift 版，
#   Qt 版流程见本文件的 git 历史。打包逻辑完全复用 clashauto 仓库自己的
#   macos/scripts/make_app.sh（arm64 + 默认集成最新正式版内核 + 先内层后外层签名），
#   本文件只做四件事：取触发参数 → 调 make_app.sh → 公证 → 发布到指定 release。
#
# 触发：clashauto 的 macos-swift job 往本分支推提交，参数写在**提交说明**里（一行一个）：
#   source-sha: <要构建的 clashauto commit>
#   source-ref: <来源分支名，beta 标题用>
#   release-tag: <发布到的 tag，如 v1.0.520 或 v1.0.521-beta.abc1234>
#   prerelease: true|false
#   version: <纯数字版本，如 1.0.520>
#   product: coast-swift
# 老式空提交（无参数）/ 手动 workflow_dispatch 时回退：构建 master、版本现算、按正式版发。
#
# 需要的 secret（本仓库 integemjack/schat.build）：
#   MACOS_CERT_P12 / MACOS_CERT_PW / MACOS_NOTARY_KEY / MACOS_NOTARY_KEY_ID / MACOS_NOTARY_ISSUER
#   CLASHAUTO_RELEASE_TOKEN —— 对 **ClashrAuto/Coast** 有 contents:write 的 PAT
#     （名字沿用旧的：改名得在仓库设置里重新添一遍，漏加时上面那句
#     「未设置…跳过发布」会让 mac 包**静默消失**。若它是细粒度 PAT，
#     要先把 Coast 加进可访问仓库，否则 gh release create 会 404。）
name: clashauto macOS (signed)

on:
  push:
    branches: [clashauto-mac]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 clashauto 分支/commit"
        default: "master"
        required: false
      release_tag:
        description: "上传到哪个 release tag（留空则不发布，只出 artifact）"
        required: false

jobs:
  clashauto-macos:
    name: clashauto macOS arm64 (Swift, signed + notarized)
    # 只处理 Swift 版的触发提交（老式空提交/别的触发不抢这个 push）。
    # 手动 dispatch 没有提交说明，一律放行。
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'product: coast-swift')"
    # ★ 必须是带 **SDK 26** 的镜像：2026-08 起 macos/Package.swift 的部署目标是 macOS 26
    #   （整套界面建在 Liquid Glass 上）。镜像更旧的话 swift build 会在
    #   「'v26' is unavailable / SDK 不支持」上失败。Select Xcode 一步会先当场喊出来。
    #   装不了 26 的机器走 Qt 版（clashauto-mac-qt.yml，部署目标 13.0）。
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Parse trigger parameters
        id: trig
        shell: bash
        env:
          # 经 env 传入而不是内插进脚本：提交说明是外部输入，内插会被当 shell 源码执行
          TRIGGER_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_REF: ${{ github.event.inputs.ref }}
          DISPATCH_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          param() { printf '%s\n' "${TRIGGER_MSG:-}" | sed -nE "s/^$1: (.*)\$/\1/p" | head -n 1; }
          sha="$(param source-sha)"
          tag="$(param release-tag)"; [ -n "$tag" ] || tag="${DISPATCH_TAG:-}"
          {
            echo "ref=${sha:-${DISPATCH_REF:-master}}"
            echo "tag=$tag"
            echo "prerelease=$(param prerelease)"
            echo "version=$(param version)"
            echo "srcref=$(param source-ref)"
          } >> "$GITHUB_OUTPUT"
          echo "构建 ref=${sha:-${DISPATCH_REF:-master}}  目标 release=${tag:-（未指定，只出 artifact）}"

      # ★ 源仓库 ClashrAuto/clashauto 2026-08 转私有了。默认的 github.token 只对
      #   **本仓库**有效，checkout 私有的源仓库会失败 —— 而 GitHub 对没有权限的私有仓库
      #   一律回 **404 而不是 403**，于是日志里只有一句
      #       remote: Repository not found.
      #       fatal: repository 'https://github.com/ClashrAuto/clashauto/' not found
      #   看着像仓库被删了或者名字写错了，完全指不到「缺一个 token」。实测代价：
      #   2026-08-12 起两条 mac 线**每一轮都在 checkout 就死**，一个包都没出过，而源仓库
      #   自己的 CI 一直是绿的（它 checkout 自己，不需要跨仓库权限）。
      #   所以这里先把「没配 token」翻译成一句能照着做的话，再去 checkout。
      - name: Check source token
        shell: bash
        env:
          SRC_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SRC_TOKEN:-}" ]; then
            echo "::error::未设置 SOURCE_TOKEN —— ClashrAuto/clashauto 是私有仓库，默认的 github.token 读不到它，checkout 会以 'Repository not found' 收场（GitHub 对无权限的私有仓库回 404 而不是 403，所以那句话并不代表仓库不存在）。请在 integemjack/schat.build 的 Actions secrets 里加一个对 ClashrAuto/clashauto 有 contents:read 的 PAT，命名 SOURCE_TOKEN。"
            exit 1
          fi
          echo "SOURCE_TOKEN 已配置"

      - name: Checkout clashauto
        uses: actions/checkout@v4
        with:
          repository: ClashrAuto/clashauto
          ref: ${{ steps.trig.outputs.ref }}
          fetch-depth: 0
          # ★★ 内核源码在 `clash` 子模块里 —— `build_libcoast_macos.sh` 把它解析成
          #   `$REPO/clash`，不检出的话它在找不到 go 之后**紧接着**再挂一次
          #   （`❌ 找不到内核源码`）。所以这一行与下面那个 setup-go 是一对，缺一不可。
          submodules: recursive
          # 私有源仓库要显式给 token（见上一步的说明）。本仓库另有一个 SRC_REPO_TOKEN，
          # 那是 SChat 自己那条线的源仓库用的 —— 别混用，两个指向不同的仓库。
          token: ${{ secrets.SOURCE_TOKEN }}

      # ★★ 把四条线共用的 GeoIP 种子换成**最新**那份。**必须在构建之前** ——
      #   Qt 走 qrc、Swift 走 Resources，都是**构建时**把种子读进去的。
      #   ⚠️ 入库那份是 2022-09-08 的：它是个二进制，谁也不会想起来去更新它，
      #   而全新安装的用户拿到的就是它。拿它和 2026-08-20 那份对 6 万个随机公网
      #   IPv4 逐个查，7.44% 判定不同，其中 1.6% 是「旧库判 CN、实际已不是 CN」——
      #   那一档会被错误直连，是断网方向。
      #   ★ 下载失败**当场判红**，与「Bundle latest stable core」同一个理由：
      #   「包里带一份四年前的 GeoIP」是静默劣化，出货之后没有任何人看得见。
      # ★★★ 这一步与 clashauto 的 `release.yml` / Coast 的 `build.yml` 是**同一件事**，
      #   但**必须在这里另写一份**：这条流水线检出 clashauto 的源码后**自己重建**，
      #   不走 Coast 的 build.yml —— 少了它，用户实际拿到的**签名** DMG 里就还是旧种子，
      #   而两边 CI 全绿、没有任何一条日志会提到这件事。
      - name: Bundle latest GeoIP
        shell: bash
        run: |
          PY=python3; command -v $PY >/dev/null 2>&1 || PY=python
          "$PY" clashauto-c++/scripts/fetch_geoip.py

      - name: Resolve version/tag
        shell: bash
        env:
          IN_TAG: ${{ steps.trig.outputs.tag }}
          IN_VER: ${{ steps.trig.outputs.version }}
          IN_PRE: ${{ steps.trig.outputs.prerelease }}
        run: |
          set -euo pipefail
          # 优先用触发参数（与 clashauto CI 建的 release 严丝合缝）；老式触发才现算。
          version="$IN_VER"
          if [ -z "$version" ]; then
            base="$(sed -nE 's/.*project[[:space:]]*\([[:space:]]*[^ ]+[[:space:]]+VERSION[[:space:]]+([0-9]+(\.[0-9]+){1,3}).*/\1/p' clashauto-c++/CMakeLists.txt | head -n 1)"
            [ -n "$base" ] || { echo "Cannot find project VERSION"; exit 1; }
            major="$(echo "$base" | cut -d. -f1)"; minor="$(echo "$base" | cut -d. -f2)"; [ -n "$minor" ] || minor=0
            version="${major}.${minor}.$(git rev-list --count HEAD)"
          fi
          {
            echo "APP_VERSION=$version"
            echo "RELEASE_TAG=${IN_TAG:-}"
            echo "IS_PRERELEASE=${IN_PRE:-false}"
          } >> "$GITHUB_ENV"
          echo "version=$version tag=${IN_TAG:-（未指定，只出 artifact）} prerelease=${IN_PRE:-false}"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          # Swift 版要 Xcode 16+；取 runner 上最新的即可（与 clashauto 的 macos-swift job 同法）。
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "使用 $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          swift --version
          # ★ 部署目标是 macOS 26，SDK 不够新的话后面每一步都会以一堆看不懂的
          #   「'v26' is unavailable」收场。在这里一句话说清，省得去翻编译日志。
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk"
          case "$sdk" in
            [1-9]|1[0-9]|2[0-5]|[1-9].*|1[0-9].*|2[0-5].*)
              echo "::error::macOS SDK $sdk < 26 —— Package.swift 的部署目标是 macOS 26，换带 Xcode 26+ 的 runner 镜像"
              exit 1;;
          esac

      - name: Import Developer ID signing cert
        id: signcert
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PW }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "MACOS_CERT_P12 未设置 — 无法签名（本工作流要求真签名）"; exit 1
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KPW="$(openssl rand -base64 18)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "${CERT_PW:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)".*/\1/')
          rm -f "$RUNNER_TEMP/cert.p12"
          [ -n "$IDENTITY" ] || { echo "证书里没有 Developer ID Application 身份"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "imported identity: $IDENTITY"

      - name: Decode provisioning profiles
        id: profiles
        shell: bash
        env:
          PROF_APP: ${{ secrets.COAST_PROFILE_APP_BASE64 }}
          PROF_TUN: ${{ secrets.COAST_PROFILE_TUNNEL_BASE64 }}
        run: |
          set -euo pipefail
          # ★★★ **NetworkExtension 与 App Group 都是「需要 provisioning 的 entitlement」。**
          #   光在 entitlements 里声明不算数：签名时系统会拿 bundle 里的
          #   embedded.provisionprofile 去核对，profile 里没有的 entitlement 即使签进去了，
          #   运行时也会被 AMFI 拒。
          #   ⚠️ 两种错法的表现都极具误导性（2026-08-25 在真机上都实测过）：
          #     · 签了 system-extension.install 而 profile 里没有 → 主程序**一启动就被
          #       SIGKILL（rc=137），零日志零输出**，看着像程序自己崩了；
          #     · 不签它 → OSSystemExtensionError 2，扩展装不上。
          #   ⇒ profile 与 entitlements 是**一对**，缺一不可。
          #
          # ★ 两份**各自对应一个 App ID**（主程序 / 扩展），它们是两个独立 bundle、
          #   各自签名。只给主程序那份的话，扩展签得上但装不进系统。
          #
          # ★ 描述文件在 developer.apple.com 上生成时，App ID 必须已经勾了
          #   **Network Extensions** 与 **System Extension** 两个 capability
          #   —— 只勾前者生成出来的 profile 里没有 system-extension.install。
          if [ -z "${PROF_APP:-}" ] || [ -z "${PROF_TUN:-}" ]; then
            echo "::error::缺 secrets COAST_PROFILE_APP_BASE64 / COAST_PROFILE_TUNNEL_BASE64 —— 没有描述文件就打不出带系统扩展的包"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/profiles"
          printf '%s' "$PROF_APP" | base64 --decode > "$RUNNER_TEMP/profiles/app.provisionprofile"
          printf '%s' "$PROF_TUN" | base64 --decode > "$RUNNER_TEMP/profiles/tunnel.provisionprofile"
          # ★ 判「解出来的确实是 profile」而不是只判非空：base64 里少一个字符
          #   解出来也是一堆字节，而那种坏文件要到 codesign 那一步才炸，报错还读不懂。
          for f in app tunnel; do
            pf="$RUNNER_TEMP/profiles/$f.provisionprofile"
            security cms -D -i "$pf" > "$RUNNER_TEMP/profiles/$f.plist" 2>/dev/null || {
              echo "::error::$f.provisionprofile 解不开 —— secret 里的 base64 多半是坏的"; exit 1; }
            /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.networking.networkextension" \
              "$RUNNER_TEMP/profiles/$f.plist" >/dev/null 2>&1 || {
              echo "::error::$f 的描述文件里没有 networkextension entitlement —— App ID 上没勾 Network Extensions？"; exit 1; }
          done
          # 主程序那份还必须带装扩展的权限
          /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.system-extension.install" \
            "$RUNNER_TEMP/profiles/app.plist" >/dev/null 2>&1 || {
            echo "::error::主程序的描述文件里没有 system-extension.install —— App ID 上要勾 System Extension 再重新生成"; exit 1; }
          echo "app=$RUNNER_TEMP/profiles/app.provisionprofile" >> "$GITHUB_OUTPUT"
          echo "tunnel=$RUNNER_TEMP/profiles/tunnel.provisionprofile" >> "$GITHUB_OUTPUT"
          echo "两份描述文件就绪，entitlement 都在"

      - name: Set up Go
        # ★★★ **这一步以前没有，于是 Swift 线的签名包从系统扩展那一轮起就没成功过一次。**
        #   `build_libcoast_macos.sh` 第一件事就是找 go，找不到 exit 2，
        #   报出来只有一行 `❌ 找不到 go` —— 而 Qt 线不需要它，所以同一个 tag 上
        #   Qt 的 DMG 正常产出、Swift 的没有，release 看着只是「少一个包」。
        # ★ 用 `stable` 而不是钉某个版本：内核的 go.mod 声明 `go 1.26`，
        #   而 GOTOOLCHAIN 默认 auto —— 真机上实测 go1.24.6 也能编出来，
        #   工具链会自己按 go.mod 升上去。钉版本只会多一处要跟着改的地方。
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build libcoast (core as a static library)
        id: libcoast
        shell: bash
        run: |
          set -euo pipefail
          # ★★★ **这条线的核心跑在系统扩展进程里，是编进去的静态库，不是外部二进制。**
          #   扩展进程不能 fork/exec，所以 mihomo 必须以 c-archive 的形式链进去。
          #   源码与 iOS 线**完全共用**（clashauto 仓库的 ios/core/*.go）——
          #   `//go:build darwin` 覆盖 macOS，两边只有内存参数不同。
          #
          # ⚠️ 外部内核（Resources/core）**仍然要**，别以为可以省：
          #   增强模式关着时核心跑在主进程里，提供 mixed-port（系统代理）与 REST（界面数据）。
          #   两个核心各管一段，不是二选一。
          if [ ! -f "$GITHUB_WORKSPACE/macos/scripts/build_libcoast_macos.sh" ]; then
            echo "::error::源仓库里没有 macos/scripts/build_libcoast_macos.sh —— 检出的 source-sha 早于系统扩展那一轮。请构建更新的 sha。"
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/macos/scripts/build_libcoast_macos.sh" "$RUNNER_TEMP/libcoast"
          LIB="$RUNNER_TEMP/libcoast/libcoast-macos.a"
          [ -s "$LIB" ] || { echo "::error::libcoast 没编出来"; exit 1; }
          echo "path=$LIB" >> "$GITHUB_OUTPUT"
          ls -lh "$LIB" | awk '{print "libcoast: "$5}'

      - name: Package Coast.app (make_app.sh)
        working-directory: macos
        shell: bash
        env:
          # make_app.sh 默认集成最新正式版内核，要打 GitHub API 挑产物；
          # Actions 共享出口 IP，匿名限流（60 次/时）几乎必中 —— 必须带 token。
          GITHUB_TOKEN: ${{ github.token }}
          SIGN_IDENTITY: ${{ steps.signcert.outputs.identity }}
          # ★★ 这三个决定「包里有没有系统扩展」。三个缺任何一个，make_app.sh 都会
          #   **静默打出一个没有扩展的包** —— 它对此是宽容的（本地开发常常不需要扩展），
          #   而那种包装到用户机上的表现是「增强模式点了没反应」。
          #   所以下面的结构断言必须跟着一起改，光传变量不够。
          COAST_LIBCOAST: ${{ steps.libcoast.outputs.path }}
          COAST_PROFILE_APP: ${{ steps.profiles.outputs.app }}
          COAST_PROFILE_TUNNEL: ${{ steps.profiles.outputs.tunnel }}
        run: |
          set -euo pipefail
          # 打包（arm64 + 集成内核 + helper/内核/app 先内层后外层签名 + entitlements）
          # 全在 clashauto 仓库的 make_app.sh 里 —— 两边共用一份逻辑，不再各自漂移。
          #
          # ★ **不带 --universal**：这条线 2026-08 起只发 arm64。部署目标本来就是 macOS 26、
          #   整套 UI 建在 Liquid Glass 上，给 Intel 再编一半只是把包撑大一倍。装不了 26 的
          #   机器走 Qt 线（-qt.dmg，13.0+、universal），那才是兼容腿。
          #   与 clashauto 仓库 release.yml 的 macos-swift job **必须保持一致**。
          # ★★★ 诊断 + 预构建（2026-08-26 加）。
          #   现象：libcoast 编出来了、COAST_LIBCOAST 也传进来了，但产出的 CoastTunnel
          #   里没有 CoastStart —— 内核没链进去。同一份脚本在真 Mac 上、同样干净的目录、
          #   同样只跑 make_app.sh，出来是 43M 且符号在。所以差异只可能在这台 runner 上，
          #   得先把每一环打出来才判得了。
          echo "COAST_LIBCOAST=[${COAST_LIBCOAST:-<空>}]"
          ls -lh "${COAST_LIBCOAST:-/nonexistent}" || echo "!! 归档文件不在"
          # ★ Package.swift 是**读环境变量**决定链不链的，而 SwiftPM 会缓存 manifest 的
          #   求值结果。显式禁掉缓存单独构建一次，把这个变量从嫌疑名单里排掉。
          swift build -c release --manifest-cache none
          TUNBIN=".build/release/CoastTunnel"
          echo "预构建后 CoastTunnel: $(du -m "$TUNBIN" 2>/dev/null | cut -f1) MB, CoastStart 符号 $(nm "$TUNBIN" 2>/dev/null | grep -c CoastStart) 处"

          bash scripts/make_app.sh --version "$APP_VERSION" --sign "$SIGN_IDENTITY"
          # 结构自查：架构、封存、内核/种子在位（缺了要等用户首启才炸）
          lipo -archs Coast.app/Contents/MacOS/Coast | grep -q arm64
          # ★ 反向断言。不带 --universal 时 make_app.sh 按**主机架构**编 —— runner 是
          #   macos-26（Apple Silicon）所以是 arm64；哪天 runs-on 被换成 Intel 镜像，产出
          #   就会是个叫 arm64 的 x86_64 包，装到用户机上直接打不开。这里当场拦住。
          ! lipo -archs Coast.app/Contents/MacOS/Coast | grep -q x86_64
          lipo -archs Coast.app/Contents/MacOS/com.yuehongsun.coast.helper | grep -q arm64
          codesign --verify --deep --strict Coast.app
          test -x Coast.app/Contents/Resources/core
          test -f Coast.app/Contents/Resources/bundle/config/config.yaml
          # helper identifier 必须 = launchd Label，错了 daemon 会被 Launch Constraint SIGKILL
          codesign -dvv Coast.app/Contents/MacOS/com.yuehongsun.coast.helper 2>&1 | grep -E 'Identifier|TeamIdentifier'

          # ── 系统扩展：这条线的增强模式全靠它 ──────────────────────────────
          #
          # ★★★ 这几条断言**必须有**：make_app.sh 在 COAST_LIBCOAST 缺失时会打出一个
          #   没有扩展的包而**不报错**（本地开发常常不需要扩展，那是它的正常行为）。
          #   于是 secret 配错、libcoast 那步悄悄失败之类的问题，会一路绿灯走到发布，
          #   用户拿到手才发现「增强模式点了没反应」。
          SYSEX="Coast.app/Contents/Library/SystemExtensions/com.yuehongsun.coast.tunnel.systemextension"
          test -d "$SYSEX" || { echo "::error::包里没有系统扩展 —— COAST_LIBCOAST/描述文件多半没传进去"; exit 1; }
          test -x "$SYSEX/Contents/MacOS/CoastTunnel"
          lipo -archs "$SYSEX/Contents/MacOS/CoastTunnel" | grep -q arm64
          ! lipo -archs "$SYSEX/Contents/MacOS/CoastTunnel" | grep -q x86_64
          # ★ 内核真的链进去了没有。**只判文件在不在是不够的** —— 没链内核时
          #   CoastTunnel 照样编得出来（CoreBridge 走的是显式失败的桩），
          #   体积差 100 倍但结构一模一样。判 Go 运行时的符号才是真判据。
          # ★ 断言之前先把两个数打出来：体积能一锤定音 —— 链了内核是 40 MB 量级，
          #   没链是 2~3 MB，而两者结构一模一样。只报「符号没找到」的话，
          #   分不清是真没链还是这台机器上 nm 读不出来。
          echo "包内 CoastTunnel: $(du -m "$SYSEX/Contents/MacOS/CoastTunnel" | cut -f1) MB, CoastStart 符号 $(nm "$SYSEX/Contents/MacOS/CoastTunnel" 2>/dev/null | grep -c CoastStart) 处"
          nm "$SYSEX/Contents/MacOS/CoastTunnel" 2>/dev/null | grep -q "CoastStart" \
            || { echo "::error::扩展里没有 CoastStart 符号 —— 内核没链进去，隧道起不来"; exit 1; }
          # 两份描述文件都得在（主程序 + 扩展各一份）
          test -f Coast.app/Contents/embedded.provisionprofile
          test -f "$SYSEX/Contents/embedded.provisionprofile"
          # 扩展的签名与 entitlement
          codesign --verify --strict "$SYSEX"
          codesign -d --entitlements - --xml "$SYSEX" 2>/dev/null \
            | plutil -p - | grep -q "packet-tunnel-provider-systemextension" \
            || { echo "::error::扩展的 entitlement 里没有 packet-tunnel-provider-systemextension"; exit 1; }
          # 主程序要能装扩展
          codesign -d --entitlements - --xml Coast.app 2>/dev/null \
            | plutil -p - | grep -q "system-extension.install" \
            || { echo "::error::主程序的 entitlement 里没有 system-extension.install —— 装不了扩展"; exit 1; }
          echo "系统扩展就位：$(du -h "$SYSEX/Contents/MacOS/CoastTunnel" | cut -f1)"

      - name: Create DMG + notarize + staple
        shell: bash
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          # ★ 名字里**不能**出现 qt：同一个 release 上还躺着 Qt 版的
          #   Coast-<ver>-macos-universal-qt.dmg（macOS 13+ 兼容线），两条线的一键更新
          #   全靠这个子串区分（Swift 侧 UpdateChecker.isQtLine 排除带 qt 的）。
          #   2026-08 品牌串由 ClashAuto- 统一改成 Coast-；改前缀是安全的 —— 更新器按
          #   平台/架构/扩展名挑资源，从不认前缀。
          DMG="dist/Coast-${APP_VERSION}-macos-arm64.dmg"
          mkdir -p dist

          # ── 自定义 Finder 布局的 dmg（「双击运行」）─────────────────────────────────
          # 暂存目录 → UDRW → Finder 用 AppleScript 写 .DS_Store（图标视图/128px/背景图/定位）
          # → 转 UDZO，失败自动回退朴素 dmg —— Finder 脚本在 runner 上偶发起不来
          # （无登录会话、AppleEvent 超时），那不该让整条发布线红掉。
          #
          # ⚠️ 布局里**没有** /Applications 软链 —— 这一版刻意做成「双击运行」（与 SChat 同款）。
          #   从 dmg 直接运行时 macOS 的 App Translocation 会把 bundle 映射到一个随机只读路径，
          #   SMAppService 注册特权 helper 会失败（= TUN/系统代理起不来）—— 这条由**应用自己**
          #   兜底：不在 /Applications 就把自己搬进去再重启（Swift 线 Sources/Coast/Relocate.swift，
          #   Qt 线 clashauto-c++/src/MacRelocate.mm）。两件事是配套的，去掉任何一个都会让另一个变成 bug。
          DMGSTAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMGSTAGE"; mkdir -p "$DMGSTAGE/.background"
          ditto "macos/Coast.app" "$DMGSTAGE/Coast.app"
          if [ -f clashauto-c++/scripts/dmg-background.png ]; then
            cp clashauto-c++/scripts/dmg-background.png "$DMGSTAGE/.background/bg.png"
          else
            echo "::warning::没有 dmg 背景图资产（源仓库版本太旧？）—— 退化成朴素窗口"
          fi
          # ★ 布局 + 兜底整段收在源仓库的 clashauto-c++/scripts/make_dmg.sh 里（2026-08-12），
          #   **四个使用方共用一份**：clashauto 的 macos / macos-swift 两个 job，以及本仓库的
          #   clashauto-mac.yml / clashauto-mac-qt.yml。本仓库检出的就是那份源码，直接调即可。
          #   窗口 bounds / 背景图尺寸 / 图标位置这三组耦合的数字也一并搬进脚本了。
          #
          #   收敛的直接原因是这两份**真的漂了，而且漂的正是那次事故的修复**：源仓库两份带着
          #   8 处 `|| return 1`、10 次 detach 重试、convert 失败诊断、末尾 `[ -f "$DMG" ]`，
          #   而这里一处都没有 —— 还停在 2026-08-10 事故前的写法（函数体里写 `set -e` 就以为够了）。
          #   `set -e` 对被当作条件求值的命令是**失效**的（`if ! ( layout_dmg )` 递归作用到函数体内），
          #   于是中途失败会一路走到末尾必然成功的 `rm -f "$RW"`，函数返回 0，**兜底根本不触发**，
          #   最后以一句光秃秃的「dmg 没生成」收尾。也就是说「release 静默少一个平台的包」这个
          #   缺陷，在**用户实际拿到包的这条流水线上一直是活的**。
          #   另外那边的 detach 有 10 次温和重试：Finder 不会在 AppleScript 一结束就放手，
          #   卷没卸干净时紧接着的 convert 必然 "Resource temporarily unavailable"。
          if [ ! -f "$GITHUB_WORKSPACE/clashauto-c++/scripts/make_dmg.sh" ]; then
            echo "::error::源仓库里没有 scripts/make_dmg.sh —— 检出的 source-sha 早于 2026-08-12。请构建更新的 sha（别把布局逻辑抄回本文件，那正是这次收敛要消灭的漂移）。"
            exit 1
          fi
          # ⚠️ 用 $GITHUB_WORKSPACE 而不是相对路径：相对路径在带 working-directory 的步骤里
          #    解析不到，表现是 exit 127（command not found）—— 127 看着像"脚本内部出错"，
          #    其实是根本没找到脚本。
          bash "$GITHUB_WORKSPACE/clashauto-c++/scripts/make_dmg.sh" "$DMGSTAGE" "$DMG" Coast Coast.app
          if [ -z "${NOTARY_KEY:-}" ]; then
            echo "缺 notary 凭据，无法公证"; exit 1
          fi
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/nkey.p8"
          # ★ `notarytool submit --wait` **被拒也返回 0**：不判状态的话，失败会以
          #   「stapler 报 Error 65」的样子冒出来，苹果给的原因一条都取不到（Qt 那条线就是
          #   这么卡了很久没人看出来的）。这里显式判，被拒就打日志再失败。
          out="$(xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/nkey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 45m --output-format json)"
          echo "$out"
          sub_id="$(printf '%s' "$out" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("id",""))')"
          status="$(printf '%s' "$out" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("status",""))')"
          if [ "$status" != "Accepted" ]; then
            # ⚠️ `${status}` 的大括号不是风格 —— mac 自带 bash 3.2 在 **UTF-8 locale** 下会把紧跟在
            #    `$var` 后面的多字节字符吞进变量名，`set -u` 当场杀掉。2026-08-12 在真 Mac
            #    （bash 3.2.57）实测：LANG=en_US.UTF-8 时这一行报 `status<乱码>: unbound variable`，
            #    于是**苹果的拒绝原因一条都打不出来**，下面那句 notarytool log 也根本不执行 ——
            #    正是这段守卫要防的症状。而 ssh 进 Mac 时 LANG 通常是空的（实测不挂），
            #    所以「在真 Mac 上验过」挡不住它；GitHub 的 mac runner 恰好设了 en_US.UTF-8。
            echo "::error::公证被拒（status=${status}）。以下是苹果给出的逐条原因："
            xcrun notarytool log "$sub_id" \
              --key "$RUNNER_TEMP/nkey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG" && echo "notarized + stapled OK"
          rm -f "$RUNNER_TEMP/nkey.p8"

      # 无论如何都把签名+公证的 DMG 作为本 run 的 artifact 上传（无需跨仓库 token，可直接下载测）
      - name: Upload signed DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coast-macos-arm64-signed
          path: dist/Coast-*-macos-arm64.dmg

      - name: Publish to Coast release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLASHAUTO_RELEASE_TOKEN }}
          SRC_REF: ${{ steps.trig.outputs.srcref }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "未设置 CLASHAUTO_RELEASE_TOKEN —— 跳过发布（DMG 已作为 artifact 上传）"
            exit 0
          fi
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "触发方没指定 release-tag —— 跳过发布（DMG 已作为 artifact 上传）"
            exit 0
          fi
          DMG="dist/Coast-${APP_VERSION}-macos-arm64.dmg"
          test -f "$DMG"
          shasum -a 256 "$DMG" | awk '{print $1}' > "$DMG.sha256"
          # 发布到触发方指定的 tag —— 正式版/beta 各回各家（早先只推空提交、这边只能猜
          # master，beta 的签名 DMG 会盖到正式版上，就是这么翻的车）。
          # ★ prerelease 绝不能碰 latest：/releases/latest 是正式版通道。
          if gh release view "$RELEASE_TAG" -R ClashrAuto/Coast >/dev/null 2>&1; then
            if [ "$IS_PRERELEASE" != "true" ]; then
              gh release edit "$RELEASE_TAG" -R ClashrAuto/Coast --latest >/dev/null 2>&1 || true
            fi
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              gh release create "$RELEASE_TAG" -R ClashrAuto/Coast \
                --title "Coast ${APP_VERSION} (beta · ${SRC_REF:-unknown})" --prerelease \
                --notes "signed + notarized macOS build (built by schat.build)"
            else
              gh release create "$RELEASE_TAG" -R ClashrAuto/Coast \
                --title "Coast ${APP_VERSION}" --latest \
                --notes "signed + notarized macOS build (built by schat.build)"
            fi
          fi
          gh release upload "$RELEASE_TAG" "$DMG" "$DMG.sha256" --clobber -R ClashrAuto/Coast
          echo "uploaded $DMG → ${RELEASE_TAG} (prerelease=$IS_PRERELEASE)"

          # ★ 传完就回头让 Coast 重算 version.json。
          #
          #   客户端查更新只读那份清单（绕开 GitHub API 的限流），而它是在 Coast 的
          #   manifest job 里生成的 —— 那时候 mac 的 DMG 还没到，清单里沿用的是上一版的条目。
          #   GitHub **不会**为「往已有 release 传资源」发事件，所以只能由知道「我刚传完」的
          #   这一方主动发起。以前靠对面一个 */30 的定时任务轮询：一天 48 次空转、把
          #   Actions 历史刷成噪声，还要最多等半小时；现在是秒级且精确。
          #
          #   失败就硬失败（单独一步，不会被误认为打包挂了）—— 默不作声的后果是
          #   清单里 mac 永远停在旧版本，而两边 CI 都是绿的。DMG 此时已经传完，
          #   手工补一句即可：
          #       gh workflow run manifest-refresh.yml -R ClashrAuto/Coast --ref main

      - name: Refresh Coast version.json
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLASHAUTO_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "未设置 CLASHAUTO_RELEASE_TOKEN —— 上面就没发布，清单也无需刷新"
            exit 0
          fi
          # ⚠️ manifest-refresh.yml **还没搬到 Coast**（那边目前只有生成出来的 build.yml，
          #    而这个工作流还需要 .github/scripts/build_version_manifest.py 一起过去）。
          #    缺它时 `gh workflow run` 报 404，会把一次**包已经传完**的 run 弄成红的。
          #    所以先探一次：不在就打醒目的 warning（注解在日志之外也看得见），
          #    在就照旧硬失败 —— 这一条搬过去之后本分支就恢复成原来的行为。
          if ! gh workflow view manifest-refresh.yml -R ClashrAuto/Coast >/dev/null 2>&1; then
            echo "::warning::ClashrAuto/Coast 上没有 manifest-refresh.yml —— DMG 已传完，但 version.json 里的 mac 条目仍停在上一版。把 clashauto 的 .github/workflows/manifest-refresh.yml 与 .github/scripts/build_version_manifest.py 一起放到 Coast 的 main 分支即可。"
            exit 0
          fi
          gh workflow run manifest-refresh.yml -R ClashrAuto/Coast --ref main
          echo "已触发 Coast 的 version.json 重算"
